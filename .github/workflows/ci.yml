# Drake CI — quality and security gates.
#
# - Every action is pinned to an immutable commit SHA (version noted inline).
# - Scanner images are pinned by digest.
# - No secrets are used anywhere: safe for a public repository and fork PRs.
# - Workflow permissions are read-only.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Local-only credentials for disposable CI service containers.
  CI_DB_URL: postgresql+psycopg://drake:ci_local_only@127.0.0.1:5432/drake
  CI_REDIS_URL: redis://127.0.0.1:6379/0

jobs:
  contracts:
    name: contracts (schema + fixtures + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drake/contracts lint
      - run: pnpm --filter @drake/contracts typecheck
      - run: pnpm --filter @drake/contracts test

  web:
    name: web (lint + typecheck + tests + build + provider guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drake/web lint
      - run: pnpm --filter @drake/web typecheck
      # Includes the static browser provider-access guard test.
      - run: pnpm --filter @drake/web test
      - run: pnpm --filter @drake/web build

  python:
    name: python (format + lint + typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src apps/worker/src
      - run: uv run pytest -m "not integration" -q
      # Does the production image contain the code the chart tells it to run?
      #
      # It did not, once: the internal listener was started with a module
      # that lived at the repository root, which the API image does not
      # copy. Both containers exited on start and a production upgrade
      # rolled back. The chart tests were checking the arguments and the TLS
      # test ran the runner from the working tree — nothing asked the image.
      #
      # An explicit step rather than a pytest with a docker guard: a guarded
      # test that silently skips is how this gets missed a second time.
      - name: production image runs the chart's entrypoint
        run: bash scripts/api_image_entrypoint_smoke.sh

  integration:
    name: integration (migrations + audit append-only + queue)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drake
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: drake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drake -d drake"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Local fixture Prometheus (digest-pinned) for the real query smoke;
      # only the prometheus + fixture-exporter services start (55432/56379
      # stay free for the job's own service containers).
      - name: start fixture prometheus
        run: docker compose -f deploy/local/docker-compose.yml up -d --wait prometheus
      - run: uv run pytest -m integration -q
        env:
          DRAKE_IT_DATABASE_URL: ${{ env.CI_DB_URL }}
          DRAKE_IT_REDIS_URL: ${{ env.CI_REDIS_URL }}
          DRAKE_IT_PROMETHEUS_URL: http://127.0.0.1:59090
      # Dev observability package: helm lint + template + rendered-manifest
      # policy checks (no cluster access, no install).
      - name: helm validation (dev observability package)
        run: bash deploy/dev/observability/validate.sh
      # Cluster agent chart: rendered-manifest policy checks (exact
      # get/list/watch RBAC, hardened pod, no Service/Secret material).
      - name: helm validation (cluster agent chart)
        run: bash deploy/agent/validate.sh

  go-agent:
    name: go agent (fmt + vet + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cluster-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/cluster-agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # history + tracked-tree scans + canary regression proving the
      # negative-fixture directory is NOT allowlisted. Image digest is pinned
      # inside the script (single source of truth with local runs).
      - name: gitleaks (history + tree + canary)
        run: bash scripts/secret-scan.sh all

  dependency-scan:
    name: dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: osv-scanner (lockfiles)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          ghcr.io/google/osv-scanner@sha256:385ff9dd9d50a573766fc226f24da1d61cd5843542ff7e04c563561bbd918e30
          scan source -r /src

  e2e:
    name: e2e (browser acceptance, OIDC + RBAC)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 pinned by digest
        image: postgres@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: drake
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: drake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drake -d drake"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        # redis:7 pinned by digest
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      E2E_DB_URL: postgresql+psycopg://drake:ci_local_only@127.0.0.1:5432/drake
      E2E_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drake/web exec playwright install --with-deps chromium
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/cluster-agent/go.mod
      # k3d pinned by version AND sha256 (kubectl + helm ship with the
      # runner image). The k3d cluster is disposable and job-local.
      - name: install k3d (pinned)
        run: |
          curl -fsSLo /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      # RBAC surface proof on a disposable cluster: every allowlisted read
      # YES, every forbidden operation NO (kubectl auth can-i matrix).
      - name: agent RBAC acceptance (disposable k3d)
        run: bash scripts/k3d_agent_acceptance.sh
      # Full-chain agent stack: disposable k3d + ephemeral TLS + agent
      # binary for the inventory E2E scenario.
      - name: agent E2E stack up
        run: bash scripts/e2e_agent_stack.sh up
      # Deployable-chart proof: image build + full rendered chart on a
      # SECOND disposable k3d cluster, incl. liveness subcommand and
      # NetworkPolicy positive/negative paths. Runs before e2e-setup so
      # its database effects are reset for the browser suite.
      - name: chart smoke (disposable k3d)
        run: bash scripts/chart_smoke_k3d.sh
        env:
          DRAKE_SMOKE_DATABASE_URL: ${{ env.E2E_DB_URL }}
          DRAKE_SMOKE_REDIS_URL: ${{ env.E2E_REDIS_URL }}

      # Do the internal agent listeners actually START?
      #
      # Three production rollouts failed on that question — a module missing
      # from the image, environment the runtime-security validator demands,
      # and a Secret mounted 0400 to a process running as uid 65532. All
      # three rendered cleanly; `helm template` cannot see any of them.
      #
      # This runs them for real: real image, real Secret volumes, the same
      # securityContext and modes production installs, on a disposable
      # cluster, and then talks to both listeners over TLS.
      - name: internal listener runtime smoke (disposable k3d)
        run: bash scripts/listener_runtime_smoke_k3d.sh
      # Fixture Prometheus (digest-pinned) backing the metrics E2E scenarios.
      - name: start fixture prometheus
        run: docker compose -f deploy/local/docker-compose.yml up -d --wait prometheus
      # Migrations + catalog seed + first Platform Owner for the fake user.
      - run: bash scripts/e2e-setup.sh
        env:
          DRAKE_DATABASE_URL: ${{ env.E2E_DB_URL }}
      # Playwright boots the fake OIDC provider (test-only), the FastAPI
      # process, and the production Next.js build, then drives Chromium.
      # No secrets are used or required; nothing is uploaded on failure —
      # traces stay on the ephemeral runner (they can contain session
      # cookies, so they are deliberately not exported).
      - run: pnpm --filter @drake/web exec playwright test
        env:
          DRAKE_E2E_DATABASE_URL: ${{ env.E2E_DB_URL }}
          DRAKE_E2E_REDIS_URL: ${{ env.E2E_REDIS_URL }}
          DRAKE_E2E_REDIS_PORT: "6379"
