apiVersion: drake.duosis.com/v1alpha1
kind: MetricCatalog
metrics:
  - key: service.request_rate
    type: counter_rate
    unit: requests_per_second
    sourceMetric: http_server_requests_total
    allowedLabels: [project, environment, service, method, route, status_class]
    forbiddenLabels: [email, user_id, request_id, trace_id, raw_path]
  - key: service.latency.p95
    type: histogram_quantile
    unit: seconds
    sourceMetric: http_server_request_duration_seconds_bucket
    quantile: 0.95
    allowedLabels: [project, environment, service, route]
  - key: tenant.storage.logical_bytes
    type: snapshot
    unit: bytes
    source: tenant-adapter
    requiredMetadata: [method, confidence, as_of]

