# Must be rejected: kubernetes runtime without clusterRef/namespace is ambiguous.
apiVersion: drake.duosis.com/v1alpha1
kind: ProjectObservability
metadata: {name: alpha}
spec:
  repository: {provider: github, owner: example-org, name: alpha}
  owners: [{team: platform}]
  environments:
    - {name: dev, runtime: kubernetes, branch: dev, criticality: medium}
  services:
    - {name: api, component: api, runtime: fastapi, metricsProfile: fastapi-v1}
  tenantModel: {mode: none}
