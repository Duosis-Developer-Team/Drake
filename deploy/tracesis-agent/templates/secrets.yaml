{{- include "tracesis-agent.require" . -}}
{{- /*
The three Secrets the sub-charts read by name. The sub-charts never template
credential material themselves (deploy/agent, deploy/otel); this chart is
the one place a customer's install creates it, so it is the one place to
look.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: tracesis-agent-server-ca
  labels:
    {{- include "tracesis-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Public material: the CA that signed Tracesis's agent listener.
  ca.pem: |
    {{- .Values.tracesis.serverCA | trim | nindent 4 }}
{{- if .Values.enrollment.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tracesis-agent-enrollment
  labels:
    {{- include "tracesis-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One-time and short-lived. Spent by the agent's first start; useless after.
  token: {{ .Values.enrollment.token | quote }}
{{- end }}
---
{{- /*
The store's two users. Generated once and kept: `lookup` reads the Secret an
earlier install created, so an upgrade never rotates a password out from
under the running store. (A `helm template` render, which cannot look up,
shows fresh values; that is expected.)
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "tracesis-clickhouse" }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: tracesis-clickhouse
  labels:
    {{- include "tracesis-agent.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, with the store's volume.
    helm.sh/resource-policy: keep
type: Opaque
data:
  ingest-password: {{ get $data "ingest-password" | default (randAlphaNum 40 | b64enc) }}
  reader-password: {{ get $data "reader-password" | default (randAlphaNum 40 | b64enc) }}
