{{- if .Values.metrics.enabled }}
{{- /*
The Prometheus server's read access, without ConfigMaps (and so without
anything a ConfigMap might hold). Kubernetes service discovery needs nodes,
services, endpoints, pods and endpoint slices; node metrics need the
kubelet proxy and /metrics.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tracesis-prometheus
  labels:
    {{- include "tracesis-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-tracesis-prometheus
  labels:
    {{- include "tracesis-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-tracesis-prometheus
subjects:
  - kind: ServiceAccount
    name: tracesis-prometheus
    namespace: {{ .Release.Namespace }}
{{- end }}
