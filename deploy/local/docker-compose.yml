# Drake LOCAL-ONLY development stack.
#
# - Binds to 127.0.0.1 exclusively; never reachable from the network.
# - Credentials below are deliberate local-only development values, not
#   secrets. Real environments never use this file.
# - `make down` keeps data. Only the explicitly destructive
#   `make destroy-local-data` removes volumes.

name: drake-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drake
      POSTGRES_PASSWORD: drake_local_only_dev
      POSTGRES_DB: drake
    ports:
      # Non-default host port: avoids colliding with any locally installed
      # PostgreSQL. Container port stays 5432.
      - "127.0.0.1:55432:5432"
    volumes:
      - drake-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drake -d drake"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    ports:
      # Non-default host port: avoids colliding with any locally installed
      # Redis. Container port stays 6379.
      - "127.0.0.1:56379:6379"
    volumes:
      - drake-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    # prom/prometheus v3.5.0 pinned by immutable digest.
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      # Local-only, non-default host port.
      - "127.0.0.1:59090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - drake-prometheus-data:/prometheus
    depends_on:
      - fixture-exporter
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:9090/-/healthy",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  fixture-exporter:
    # python:3.13-slim pinned by immutable digest; serves deterministic
    # fixture metrics to Prometheus over the compose network only.
    image: python@sha256:bf503bb2243c5aad0aa951544dd60d165f992646441d35dea90893703fc26251
    command: ["python", "/fixture/fixture_exporter.py"]
    volumes:
      - ./prometheus/fixture_exporter.py:/fixture/fixture_exporter.py:ro

  clickhouse:
    # clickhouse/clickhouse-server 26.8.36.3 (26.8 LTS) pinned by digest.
    # Drake's log and trace store (ADR-0029). Two users, defined in
    # clickhouse/users.d: one that may write (the collector) and one that
    # may only read (the API). The default user is not used.
    image: clickhouse/clickhouse-server@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    ports:
      # Local-only, non-default host port. HTTP interface only: that is
      # what the API speaks.
      - "127.0.0.1:58123:8123"
    volumes:
      # Single files, not the directories: the image ships its own
      # config.d/docker_related_config.xml (listen on all interfaces inside
      # the container), and mounting over the whole directory removes it.
      - ./clickhouse/config.d/drake.xml:/etc/clickhouse-server/config.d/drake.xml:ro
      - ./clickhouse/users.d/drake.xml:/etc/clickhouse-server/users.d/drake.xml:ro
      - drake-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 24

  otel-collector:
    # otel/opentelemetry-collector-contrib 0.162.0 pinned by digest. The
    # contrib distribution is the one that carries the ClickHouse exporter.
    image: otel/opentelemetry-collector-contrib@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports:
      # OTLP from local applications and the fixture emitter. Local-only,
      # non-default host ports.
      - "127.0.0.1:54317:4317"
      - "127.0.0.1:54318:4318"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  drake-postgres-data:
  drake-redis-data:
  drake-prometheus-data:
  drake-clickhouse-data:
