# Drake LOCAL-ONLY OpenTelemetry Collector.
#
# One collector plays both roles locally: it receives OTLP (from the fixture
# emitter or an application you are running) and writes logs and traces to
# the local ClickHouse. In a cluster the same pipeline is split into a
# per-node agent and a gateway (deploy/otel); the processors are identical
# so that what is tested here is what runs there.

extensions:
  # The external door's token. LOCAL ONLY value (deploy/local/otel/external-token);
  # in a cluster it is a Secret created out of band.
  bearertokenauth/external:
    filename: /etc/otelcol/external-token

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # The door for agent-running systems OUTSIDE the cluster: OTLP/HTTP on its
  # own port and path (/otlp/v1/traces, so it never collides with the API's
  # /v1), and nothing without the bearer token.
  otlp/external:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        traces_url_path: /otlp/v1/traces
        auth:
          authenticator: bearertokenauth/external


processors:
  # First in every pipeline: refuse data before the process grows, rather
  # than after.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Defence in depth, not a guarantee (ADR-0029 §5): credential-shaped
  # values are masked before anything is stored, and an oversized body is
  # cut down to a bounded size.
  transform/redact:
    error_mode: ignore
    log_statements:
      - replace_pattern(log.body, "(?i)((?:password|passwd|pwd|token|secret|api[_-]?key|access[_-]?key)\\s*[=:]\\s*)\\S+", "$$1[REDACTED]")
      - replace_pattern(log.body, "(?i)(bearer\\s+)[a-z0-9._~+/=-]{8,}", "$$1[REDACTED]")
      - replace_pattern(log.body, "(://[^/\\s@:]+:)[^@\\s]+(@)", "$$1[REDACTED]$$2")
      - set(log.body, Substring(log.body, 0, 16384)) where Len(log.body) > 16384


  # --- AI agents (Tracesis Agent Visibility, phase 1) -------------------
  # Every source of agent telemetry is turned into ONE shape, OpenTelemetry
  # GenAI (`gen_ai.*`), before anything is stored: OpenInference (Phoenix,
  # Arize) and OpenLLMetry (Traceloop) through the contrib normaliser's
  # built-ins; the older OTel names and the Vercel AI SDK's legacy `ai.*`
  # attributes through mappings written here. Same block as the gateway.
  gen_ai_normalizer:
    sources:
      - name: openinference
        remove_originals: true
      - name: openllmetry
        remove_originals: true
      - name: otel_legacy
        remove_originals: true
        mappings:
          gen_ai.system: gen_ai.provider.name
          gen_ai.usage.prompt_tokens: gen_ai.usage.input_tokens
          gen_ai.usage.completion_tokens: gen_ai.usage.output_tokens
      - name: vercel_ai_legacy
        remove_originals: true
        mappings:
          ai.model.id: gen_ai.request.model
          ai.response.model: gen_ai.response.model
          ai.usage.promptTokens: gen_ai.usage.input_tokens
          ai.usage.completionTokens: gen_ai.usage.output_tokens
          ai.telemetry.functionId: gen_ai.agent.name

  # Prompts, answers, system instructions and tool arguments/results are
  # never stored (decided 2026-11-21). OpenTelemetry keeps them opt-in, but
  # some SDKs send them by default (Vercel AI SDK v7), so they are removed
  # here, under every name they are known by, before ClickHouse sees them.
  # Counts, names and durations stay.
  transform/genai-content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
          - delete_key(attributes, "gen_ai.tool.definitions")
          - delete_matching_keys(attributes, "^gen_ai\\.(prompt|completion)(\\..*)?$")
          - delete_matching_keys(attributes, "^(input|output)\\.(value|mime_type)$")
          - delete_matching_keys(attributes, "^llm\\.(input_messages|output_messages|prompts|prompt_template)(\\..*)?$")
          - delete_matching_keys(attributes, "^ai\\.(prompt|response\\.(text|object|toolCalls|reasoning)|toolCall\\.(args|result))(\\..*)?$")
      - context: spanevent
        statements:
          - delete_matching_keys(attributes, "^gen_ai\\.(prompt|completion|input|output|system_instructions|tool\\.call)(\\..*)?$")

  # The content-carrying GenAI events, dropped whole: on spans and, when a
  # library sends them as log records instead, in the logs pipeline.
  filter/genai-content:
    error_mode: ignore
    traces:
      spanevent:
        - 'IsMatch(name, "^gen_ai\\.(content\\.|user\\.message|assistant\\.message|system\\.message|tool\\.message|choice|client\\.inference\\.operation\\.details)")'
    logs:
      log_record:
        - 'IsMatch(event_name, "^gen_ai\\.")'
        - 'IsMatch(attributes["event.name"], "^gen_ai\\.")'

  # Marks what came through the external door, so a screen can say where
  # an agent reports from.
  resource/external:
    attributes:
      - key: tracesis.ingest
        value: external
        action: upsert

  batch:
    send_batch_size: 2000
    timeout: 2s

exporters:
  # Two exporter instances because retention differs by signal: the
  # exporter's `ttl` applies to every table it creates.
  clickhouse/logs:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: drake_ingest
    password: drake_local_only_ingest
    create_schema: true
    ttl: 168h
    logs_table_name: otel_logs
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 100
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
  clickhouse/traces:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: drake_ingest
    password: drake_local_only_ingest
    create_schema: true
    ttl: 72h
    traces_table_name: otel_traces
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 100
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s

service:
  extensions: [bearertokenauth/external]
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/genai-content, transform/redact, batch]
      exporters: [clickhouse/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, gen_ai_normalizer, transform/genai-content, filter/genai-content, batch]
      exporters: [clickhouse/traces]
    traces/external:
      receivers: [otlp/external]
      processors: [memory_limiter, resource/external, gen_ai_normalizer, transform/genai-content, filter/genai-content, batch]
      exporters: [clickhouse/traces]
