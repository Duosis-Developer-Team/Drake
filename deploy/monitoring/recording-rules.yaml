# Drake's workload normalisation layer.
#
# Drake asks for workload-scoped signals by `namespace` + `workload_name`.
# Kubernetes publishes them per POD (cAdvisor, kube-state-metrics), and a
# pod's name is not its workload's name. These rules add the missing label
# and change nothing else.
#
# Three decisions worth knowing, because each has a wrong-looking
# alternative that is easy to reach for:
#
# 1. The rules ENRICH per-pod series instead of pre-aggregating them. A
#    summed counter looks tidier, but when a pod is replaced its series
#    disappears and the sum drops — `rate()`/`increase()` read that drop as
#    a counter reset and compensate, inflating exactly the number an
#    operator is most likely to be looking at (restarts, during a rollout).
#    Keeping one series per pod means Prometheus handles resets per series,
#    the way it is designed to, and Drake sums afterwards.
#
# 2. They are published under `drake:` names rather than re-emitting
#    `container_cpu_usage_seconds_total` with an extra label. Re-emitting
#    would double every unqualified `sum(rate(container_cpu…))` in this
#    Prometheus for anyone else who uses it later. A recording rule that
#    silently changes what an unrelated query returns is a trap.
#
# 3. The pod → workload mapping comes from `kube_pod_owner`, not from a
#    regex over pod names. Pod names cannot tell you the owner kind:
#    `api-7d9f8b`, could be a DaemonSet pod or a StatefulSet's sixth
#    replica, and the two need different suffixes stripped.
#
# `groups[].interval` is 30s to match the shortest step Drake's budgets
# allow (`minStepSeconds: 30`); a slower rule would leave gaps a chart
# would draw as an outage.

groups:
  - name: drake.pod-workload-identity
    interval: 30s
    rules:
      # ReplicaSet-owned pods: the RS name is `<deployment>-<template-hash>`,
      # so exactly one trailing segment is the hash. Anchored, and it strips
      # ONE segment: a deployment legitimately named `hermes-api-v2` keeps
      # its name.
      - record: drake:pod:workload
        expr: |
          max by (namespace, pod, workload_name) (
            label_replace(
              kube_pod_owner{owner_kind="ReplicaSet"},
              "workload_name", "$1", "owner_name", "^(.*)-[^-]+$"
            )
          )
      # StatefulSets and DaemonSets own their pods directly, so the owner
      # name IS the workload name.
      - record: drake:pod:workload
        expr: |
          max by (namespace, pod, workload_name) (
            label_replace(
              kube_pod_owner{owner_kind=~"StatefulSet|DaemonSet"},
              "workload_name", "$1", "owner_name", "^(.*)$"
            )
          )

  - name: drake.workload-pod-signals
    interval: 30s
    rules:
      # Multiplying by the mapping (whose value is always 1) preserves the
      # left-hand value and carries `workload_name` across. `container!=""`
      # drops the pod-level cgroup roll-up, which would double every sum.
      - record: drake:workload_pod:cpu_usage_seconds_total
        expr: |
          container_cpu_usage_seconds_total{container!="", container!="POD"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      - record: drake:workload_pod:memory_working_set_bytes
        expr: |
          container_memory_working_set_bytes{container!="", container!="POD"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      - record: drake:workload_pod:cpu_cfs_throttled_periods_total
        expr: |
          container_cpu_cfs_throttled_periods_total{container!="", container!="POD"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      - record: drake:workload_pod:cpu_cfs_periods_total
        expr: |
          container_cpu_cfs_periods_total{container!="", container!="POD"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      - record: drake:workload_pod:restarts_total
        expr: |
          kube_pod_container_status_restarts_total
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      # kube-state-metrics publishes limits as one series per resource
      # kind. Drake asks for cores and bytes separately, so they are split
      # here rather than in the query.
      - record: drake:workload_pod:cpu_limit_cores
        expr: |
          kube_pod_container_resource_limits{resource="cpu"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      - record: drake:workload_pod:memory_limit_bytes
        expr: |
          kube_pod_container_resource_limits{resource="memory"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload

  - name: drake.workload-replicas
    interval: 30s
    rules:
      # One name per controller kind, because "desired replicas" is a
      # different metric for each and Drake asks one question.
      - record: drake:workload:replicas_desired
        expr: |
          max by (namespace, workload_name) (
            label_replace(kube_deployment_spec_replicas, "workload_name", "$1", "deployment", "(.*)")
          )
      - record: drake:workload:replicas_desired
        expr: |
          max by (namespace, workload_name) (
            label_replace(kube_statefulset_replicas, "workload_name", "$1", "statefulset", "(.*)")
          )
      - record: drake:workload:replicas_desired
        expr: |
          max by (namespace, workload_name) (
            label_replace(
              kube_daemonset_status_desired_number_scheduled,
              "workload_name", "$1", "daemonset", "(.*)"
            )
          )
      - record: drake:workload:replicas_ready
        expr: |
          max by (namespace, workload_name) (
            label_replace(
              kube_deployment_status_replicas_ready, "workload_name", "$1", "deployment", "(.*)"
            )
          )
      - record: drake:workload:replicas_ready
        expr: |
          max by (namespace, workload_name) (
            label_replace(
              kube_statefulset_status_replicas_ready, "workload_name", "$1", "statefulset", "(.*)"
            )
          )
      - record: drake:workload:replicas_ready
        expr: |
          max by (namespace, workload_name) (
            label_replace(
              kube_daemonset_status_number_ready, "workload_name", "$1", "daemonset", "(.*)"
            )
          )

  # Why a container is NOT running, which is the question every restart
  # count raises and none of them answers. `reason` is kept as a label —
  # CrashLoopBackOff, ImagePullBackOff and ErrImagePull are different
  # problems with different first moves, and collapsing them into "waiting"
  # would throw away the only part an operator acts on.
  - name: drake.workload-failure
    interval: 30s
    rules:
      - record: drake:workload_pod:waiting_reason
        expr: |
          kube_pod_container_status_waiting_reason{reason!=""}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload
      # Replicas the workload wants but does not have. Distinct from
      # `replicas_desired - replicas_ready`, which is the same arithmetic
      # done by the reader: this is what the controller itself reports, so
      # a rollout that is mid-flight and one that is stuck look the same
      # here and are told apart by how long the value persists.
      - record: drake:workload:replicas_unavailable
        expr: |
          max by (namespace, workload_name) (
            label_replace(
              kube_deployment_status_replicas_unavailable,
              "workload_name", "$1", "deployment", "(.*)"
            )
          )
      # Pods that exist but are not Ready. `kube_pod_status_ready` carries a
      # `condition` label with true/false/unknown; only the false series is
      # a problem, and `unknown` is deliberately excluded rather than folded
      # in — not knowing is not the same as knowing it is unready.
      - record: drake:workload_pod:not_ready
        expr: |
          kube_pod_status_ready{condition="false"}
          * on (namespace, pod) group_left(workload_name) drake:pod:workload

  # Capacity that fills up silently. None of these page anyone on the day
  # they change; they page someone on the day they run out, which is why
  # they belong on a screen rather than in an alert alone.
  - name: drake.cluster-capacity-headroom
    interval: 60s
    rules:
      # Real filesystems only. tmpfs is memory and overlay double-counts the
      # layer beneath it, so including either reports headroom that does not
      # exist. Kept per-mountpoint: one full disk is a problem even when the
      # average across a node looks comfortable.
      - record: drake:node_filesystem:free_ratio
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
      # By PHASE rather than as a count of failures. A count would be empty
      # when everything is healthy, and an empty result renders as "no data"
      # — which is the one thing this product must not confuse with zero.
      # With the label kept, "all Bound" is a visible answer and a Pending
      # claim arrives as its own series.
      - record: drake:pvc:by_phase
        expr: sum by (namespace, phase) (kube_persistentvolumeclaim_status_phase == 1)
      # Seconds of certificate life left. Drake's own edge certificate is in
      # here: it is renewed by cert-manager automatically, and the value of
      # watching it is precisely that nobody looks until it has failed.
      - record: drake:certificate:seconds_remaining
        expr: certmanager_certificate_expiration_timestamp_seconds - time()

  - name: drake.workload-freshness
    interval: 30s
    rules:
      # "Is this pipeline still describing this workload?" — 1 while the
      # mapping is being produced, absent once it stops. Deliberately NOT
      # the scrape `up` of an application target: no application here is
      # scraped, and reporting a target's health as the workload's would be
      # a claim nothing supports.
      - record: drake:workload:up
        expr: max by (namespace, workload_name) (drake:pod:workload)
