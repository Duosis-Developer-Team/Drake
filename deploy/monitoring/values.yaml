# Drake's metrics backend — prometheus-community/prometheus.
#
# This cluster had no Prometheus at all. Drake's telemetry adapter speaks
# only Prometheus (every one of the 22 query templates is
# `providerType: prometheus`), so every metric panel in the product was
# empty for the most boring possible reason: there was nothing to ask.
#
# Datadog and Zabbix agents already run here. Neither is replaced and
# neither is touched — Drake simply has no adapter for them, and writing
# one to avoid installing Prometheus would be a much larger commitment
# than this file.
#
# Scope kept deliberately small: a server, kube-state-metrics and
# node-exporter. Alertmanager and Pushgateway stay off because nothing
# consumes them yet; turning them on before there is a consumer produces
# alerts nobody routes.

alertmanager:
  # On now, because Drake is its consumer: the Active incidents card reads
  # `/v1/webhooks/alertmanager/{key}` deliveries, and with no Alertmanager
  # there is nothing to read. It stayed off until there was one.
  enabled: true

  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi

  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

  config:
    global:
      resolve_timeout: 5m
    route:
      # One group per alert name and workload, so two unhealthy workloads
      # are two notifications rather than one that names neither.
      group_by: ["alertname", "namespace", "workload_name"]
      group_wait: 30s
      group_interval: 5m
      # Drake dedupes on an immutable fingerprint, so a repeat is cheap and
      # keeps `last seen` honest without growing the timeline.
      repeat_interval: 12h
      # Platform alerts (project=drake) land here. Drake's ingest fixes the
      # project from the integration, sees a claim it cannot honour, and
      # records them as unmapped platform evidence — which is the truthful
      # outcome for a failing node that belongs to nobody's service.
      receiver: drake-platform
      routes:
        - matchers: ['project="hermes"']
          receiver: drake-hermes
        - matchers: ['project="logislot"']
          receiver: drake-logislot
        - matchers: ['project="fikir-sepeti"']
          receiver: drake-fikir-sepeti
    receivers:
      # In-cluster, to the API Service — a notification is internal traffic
      # and has no reason to leave the cluster and come back through the
      # public edge. Native Alertmanager signs nothing, so the bearer token
      # IS the authentication; it is mounted from a Secret, never inline.
      - name: drake-platform
        webhook_configs:
          - url: http://drake-api.drake-prod.svc.cluster.local:8000/v1/webhooks/alertmanager/hermes
            send_resolved: true
            http_config:
              authorization: {type: Bearer, credentials_file: /etc/alertmanager/drake/hermes}
      - name: drake-hermes
        webhook_configs:
          - url: http://drake-api.drake-prod.svc.cluster.local:8000/v1/webhooks/alertmanager/hermes
            send_resolved: true
            http_config:
              authorization: {type: Bearer, credentials_file: /etc/alertmanager/drake/hermes}
      - name: drake-logislot
        webhook_configs:
          - url: http://drake-api.drake-prod.svc.cluster.local:8000/v1/webhooks/alertmanager/logislot
            send_resolved: true
            http_config:
              authorization: {type: Bearer, credentials_file: /etc/alertmanager/drake/logislot}
      - name: drake-fikir-sepeti
        webhook_configs:
          - url: http://drake-api.drake-prod.svc.cluster.local:8000/v1/webhooks/alertmanager/fikir-sepeti
            send_resolved: true
            http_config:
              authorization: {type: Bearer, credentials_file: /etc/alertmanager/drake/fikir-sepeti}
    inhibit_rules:
      # A node that is down explains every workload on it. Without this, one
      # node failure arrives as a page per workload.
      - source_matchers: ['alertname="NodeNotReady"']
        target_matchers: ['severity=~"warning|critical"']
        equal: ["node"]

  extraSecretMounts:
    # One Secret, one key per integration. Created out of band by
    # deploy/monitoring/webhook-tokens.sh; the same values are mounted into
    # the API so both ends compare the same material without either holding
    # a copy in Git or in an environment variable.
    - name: drake-webhook-tokens
      mountPath: /etc/alertmanager/drake
      subPath: ""
      secretName: drake-alertmanager-webhook
      readOnly: true

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  # The default collector set includes `secrets`, and collecting a resource
  # means holding cluster-wide `list` on it — which returns the values, not
  # just the metadata kube-state-metrics publishes. Drake's own agent is
  # denied secrets deliberately; installing a component that holds what the
  # agent may not would move the cluster's posture backwards to light up a
  # chart nobody asked for.
  #
  # This list is what the recording rules actually read, plus the two
  # (namespaces, persistentvolumeclaims) an operator reaches for next.
  # `configmaps` is absent for the same reason as `secrets`: people put
  # things in them that they would not put in a metric.
  collectors:
    - daemonsets
    - deployments
    - namespaces
    - nodes
    - persistentvolumeclaims
    - pods
    - replicasets
    - statefulsets

prometheus-node-exporter:
  enabled: true

server:
  # The narrowed ClusterRole from rbac.yaml, applied out of band. The chart
  # then binds to it instead of creating one that can read every ConfigMap
  # in the cluster.
  useExistingClusterRoleName: drake-metrics-prometheus-read

  # Seven days. Drake's own query budgets cap a range at seven days
  # (`maxRangeSeconds: 604800`), so retaining more would store what no
  # query can ask for.
  retention: 7d

  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 20Gi

  # This is a two-node cluster running other teams' production workloads.
  # The requests are what Prometheus needs to stay responsive; the limits
  # are what keeps a runaway cardinality problem from becoming everyone's
  # problem.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # No ingress, no NodePort: Drake reaches it through the cluster Service
  # and nothing outside the cluster can reach it at all.
  #
  # The ClusterIP is PINNED, and that is the whole reason this works.
  # Drake refuses hostname connectors in production (httpx re-resolves
  # independently of the SSRF check, so a hostile DNS answer could flip
  # public→private between validating and connecting), which leaves an IP
  # literal — and an unpinned ClusterIP changes whenever the Service is
  # recreated, which is the failure the agent's egress rule already taught
  # us. Declared here, it is a constant that survives a reinstall.
  #
  # 10.233.0.42 sits in the static band at the bottom of the service CIDR
  # (10.233.0.0/18), which Kubernetes does not hand out dynamically.
  service:
    type: ClusterIP
    clusterIP: 10.233.0.42

serverFiles:
  # Loaded from deploy/monitoring/recording-rules.yaml by install.sh, so
  # the rules stay reviewable as YAML instead of a quoted string here.
  recording_rules.yml: {}
