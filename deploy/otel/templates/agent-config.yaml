{{- include "drake-otel.require" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: drake-otel-agent
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog:
        include:
          {{- range .Values.agent.namespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        exclude:
          # Never collect Drake's own collection pipeline: a collector
          # that reads its own output is a feedback loop.
          - /var/log/pods/{{ .Release.Namespace }}_*/*/*.log
        start_at: {{ .Values.agent.startAt }}
        max_log_size: {{ .Values.agent.maxLogSize }}
        # The container parser reads namespace, pod, pod uid and container
        # name FROM the file path, so the path has to be on the record. It
        # is removed again right after, so it is never stored.
        include_file_path: true
        include_file_name: false
        operators:
          # Parses the CRI/docker line format and sets namespace, pod, pod
          # uid and container name from the file path.
          - type: container
            id: container-parser
          - type: remove
            id: drop-file-path
            field: attributes["log.file.path"]
          # JSON lines carry their own level ("level", Python's "levelname",
          # "severity", "lvl"), but a container log line arrives with no
          # severity at all, so "errors only" could not select them. Parse
          # the line into a scratch attribute, read the level from it, then
          # drop the scratch copy: the body is stored exactly as written and
          # nothing else grows. Lines that are not JSON, or not valid JSON,
          # pass through untouched; nothing is ever dropped here.
          - type: json_parser
            id: json-scratch
            if: 'body matches "^\\s*\\{"'
            parse_from: body
            parse_to: attributes["drake.json"]
            on_error: send_quiet
          - type: move
            id: level-from-levelname
            if: 'attributes["drake.json"] != nil and attributes["drake.json"]["level"] == nil and attributes["drake.json"]["levelname"] != nil'
            from: attributes["drake.json"]["levelname"]
            to: attributes["drake.json"]["level"]
          - type: move
            id: level-from-severity
            if: 'attributes["drake.json"] != nil and attributes["drake.json"]["level"] == nil and attributes["drake.json"]["severity"] != nil'
            from: attributes["drake.json"]["severity"]
            to: attributes["drake.json"]["level"]
          - type: move
            id: level-from-lvl
            if: 'attributes["drake.json"] != nil and attributes["drake.json"]["level"] == nil and attributes["drake.json"]["lvl"] != nil'
            from: attributes["drake.json"]["lvl"]
            to: attributes["drake.json"]["level"]
          - type: severity_parser
            id: json-level
            if: 'attributes["drake.json"] != nil and attributes["drake.json"]["level"] != nil'
            parse_from: attributes["drake.json"]["level"]
            on_error: send_quiet
            # On top of the default names: the spellings real services use,
            # and pino's numeric levels (10 trace … 60 fatal).
            mapping:
              debug: [{min: 10, max: 29}]
              info: [{min: 30, max: 39}, notice, NOTICE]
              warn: [warning, WARNING, Warning, {min: 40, max: 49}]
              error: [err, ERR, {min: 50, max: 59}]
              fatal: [critical, CRITICAL, Critical, panic, PANIC, {min: 60, max: 69}]
          - type: remove
            id: drop-json-scratch
            if: 'attributes["drake.json"] != nil'
            field: attributes["drake.json"]
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.agent.memoryLimitMiB }}
        spike_limit_mib: {{ div .Values.agent.memoryLimitMiB 4 }}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName | quote }}
            action: upsert
      batch:
        send_batch_size: 1000
        timeout: 5s
    exporters:
      otlp:
        endpoint: drake-otel-gateway.{{ .Release.Namespace }}.svc:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 100
        retry_on_failure:
          enabled: true
          max_elapsed_time: 60s
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
        metrics:
          level: none
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resource/cluster, batch]
          exporters: [otlp]
