{{- include "drake-otel.require" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: drake-otel-gateway
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if .Values.gateway.externalIngest.enabled }}
      # The external door's token, from an out-of-band Secret mounted as a
      # file; the value never appears in this ConfigMap.
      bearertokenauth/external:
        filename: /etc/otelcol-external/token
      {{- end }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          # OTLP/HTTP inside the cluster: most AI SDKs and agent
          # frameworks export over HTTP by default.
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.gateway.externalIngest.enabled }}
      # The door for agent-running systems outside the cluster: OTLP/HTTP
      # traces on their own port and path (/otlp/v1/traces never collides
      # with the API's /v1), and nothing without the bearer token.
      otlp/external:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
            traces_url_path: /otlp/v1/traces
            # Claude Code sends its usage as metrics and events (log
            # records); both come through the same door, and only Claude
            # Code's are kept (filter/claude-code below).
            logs_url_path: /otlp/v1/logs
            metrics_url_path: /otlp/v1/metrics
            auth:
              authenticator: bearertokenauth/external
      {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.gateway.memoryLimitMiB }}
        spike_limit_mib: {{ div .Values.gateway.memoryLimitMiB 4 }}
      transform/redact:
        error_mode: ignore
        log_statements:
          - replace_pattern(log.body, "(?i)((?:password|passwd|pwd|token|secret|api[_-]?key|access[_-]?key)\\s*[=:]\\s*)\\S+", "$$1[REDACTED]")
          - replace_pattern(log.body, "(?i)(bearer\\s+)[a-z0-9._~+/=-]{8,}", "$$1[REDACTED]")
          - replace_pattern(log.body, "(://[^/\\s@:]+:)[^@\\s]+(@)", "$$1[REDACTED]$$2")
          - set(log.body, Substring(log.body, 0, 16384)) where Len(log.body) > 16384
      # --- AI agents (Tracesis Agent Visibility, phase 1) -------------------
      # Every source of agent telemetry is turned into ONE shape, OpenTelemetry
      # GenAI (`gen_ai.*`), before anything is stored: OpenInference (Phoenix,
      # Arize) and OpenLLMetry (Traceloop) through the contrib normaliser's
      # built-ins; the older OTel names and the Vercel AI SDK's legacy `ai.*`
      # attributes through mappings written here. Same block as the gateway.
      gen_ai_normalizer:
        sources:
          - name: openinference
            remove_originals: true
          - name: openllmetry
            remove_originals: true
          - name: otel_legacy
            remove_originals: true
            mappings:
              gen_ai.system: gen_ai.provider.name
              gen_ai.usage.prompt_tokens: gen_ai.usage.input_tokens
              gen_ai.usage.completion_tokens: gen_ai.usage.output_tokens
          - name: vercel_ai_legacy
            remove_originals: true
            mappings:
              ai.model.id: gen_ai.request.model
              ai.response.model: gen_ai.response.model
              ai.usage.promptTokens: gen_ai.usage.input_tokens
              ai.usage.completionTokens: gen_ai.usage.output_tokens
              ai.telemetry.functionId: gen_ai.agent.name

      # Prompts, answers, system instructions and tool arguments/results are
      # never stored (decided 2026-11-21). OpenTelemetry keeps them opt-in, but
      # some SDKs send them by default (Vercel AI SDK v7), so they are removed
      # here, under every name they are known by, before ClickHouse sees them.
      # Counts, names and durations stay.
      transform/genai-content:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "gen_ai.input.messages")
              - delete_key(attributes, "gen_ai.output.messages")
              - delete_key(attributes, "gen_ai.system_instructions")
              - delete_key(attributes, "gen_ai.tool.call.arguments")
              - delete_key(attributes, "gen_ai.tool.call.result")
              - delete_key(attributes, "gen_ai.tool.definitions")
              - delete_matching_keys(attributes, "^gen_ai\\.(prompt|completion)(\\..*)?$")
              - delete_matching_keys(attributes, "^(input|output)\\.(value|mime_type)$")
              - delete_matching_keys(attributes, "^llm\\.(input_messages|output_messages|prompts|prompt_template)(\\..*)?$")
              - delete_matching_keys(attributes, "^ai\\.(prompt|response\\.(text|object|toolCalls|reasoning)|toolCall\\.(args|result))(\\..*)?$")
          - context: spanevent
            statements:
              - delete_matching_keys(attributes, "^gen_ai\\.(prompt|completion|input|output|system_instructions|tool\\.call)(\\..*)?$")

      # The content-carrying GenAI events, dropped whole: on spans and, when a
      # library sends them as log records instead, in the logs pipeline.
      filter/genai-content:
        error_mode: ignore
        traces:
          spanevent:
            - 'IsMatch(name, "^gen_ai\\.(content\\.|user\\.message|assistant\\.message|system\\.message|tool\\.message|choice|client\\.inference\\.operation\\.details)")'
        logs:
          log_record:
            - 'IsMatch(event_name, "^gen_ai\\.")'
            - 'IsMatch(attributes["event.name"], "^gen_ai\\.")'
      {{- with .Values.gateway.selfNamespace }}
      # Tracesis traced by its own OBI: keep what its users ask of it, drop
      # its clockwork. Root client spans are calls no request made (the
      # background loops' SQL, Redis leases, Prometheus reads); the Postgres
      # server side repeats every client SQL span; Redis calls are lease and
      # queue mechanics. Requests and the work they cause stay.
      filter/self-clockwork:
        error_mode: ignore
        traces:
          span:
            - 'resource.attributes["k8s.namespace.name"] == {{ . | quote }} and kind == SPAN_KIND_CLIENT and IsRootSpan()'
            - 'resource.attributes["k8s.namespace.name"] == {{ . | quote }} and resource.attributes["k8s.statefulset.name"] != nil and kind == SPAN_KIND_SERVER'
            - 'resource.attributes["k8s.namespace.name"] == {{ . | quote }} and attributes["db.system"] == "redis"'
            - 'resource.attributes["k8s.namespace.name"] == {{ . | quote }} and attributes["db.system.name"] == "redis"'
            # The cluster agent streams inventory all day; each ingest request
            # runs dozens of statements. The requests stay (their count and
            # latency are the story); the SQL under them is dropped.
            - 'resource.attributes["k8s.namespace.name"] == {{ . | quote }} and resource.attributes["k8s.deployment.name"] == "drake-agent-gateway" and kind == SPAN_KIND_CLIENT'
      {{- end }}
      {{- if .Values.gateway.externalIngest.enabled }}
      # --- Development agents (Agent Visibility: coding agents) ------------
      # Claude Code's own telemetry: counts, cost, tokens, tool names and
      # durations. Through the external door only Claude Code is accepted,
      # and only what says which catalog project it worked on is useful —
      # Tracesis keeps the rest out at ingest.
      filter/claude-code:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["service.name"] != "claude-code"'
            # Content-bearing events, whole: answers and raw API bodies.
            - 'IsMatch(attributes["event.name"], "^(claude_code\\.)?(assistant_response|api_request_body|api_response_body|system_prompt)$")'
        metrics:
          metric:
            - 'resource.attributes["service.name"] != "claude-code"'
      # Never kept from Claude Code: the person's email (a standard attribute
      # on every record), prompt and answer text, tool parameters and inputs,
      # error text, workspace paths. Names, counts, durations and models stay.
      transform/claude-code:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - delete_key(attributes, "user.email")
              - delete_matching_keys(attributes, "^host\\.(name|id)$")
          - context: log
            statements:
              - delete_key(attributes, "user.email")
              - delete_key(attributes, "prompt")
              - delete_key(attributes, "prompt_text")
              - delete_key(attributes, "response")
              - delete_key(attributes, "tool_parameters")
              - delete_key(attributes, "tool_input")
              - delete_key(attributes, "error")
              - delete_key(attributes, "workspace.host_paths")
              - set(body, "") where body != nil
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "user.email")
              - delete_matching_keys(attributes, "^host\\.(name|id)$")
          - context: datapoint
            statements:
              - delete_key(attributes, "user.email")
      resource/external:
        attributes:
          - key: tracesis.ingest
            value: external
            action: upsert
      {{- end }}
      batch:
        send_batch_size: 2000
        timeout: 5s
      # Spans arrive from OBI, which knows the namespace and workload but
      # not the name Drake's catalog gives this cluster. Logs get it from
      # the agent; traces get it here, so both match a binding the same way.
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName | quote }}
            action: upsert
    exporters:
      clickhouse/logs:
        endpoint: tcp://drake-otel-clickhouse:9000
        database: otel
        username: drake_ingest
        password: ${env:DRAKE_CH_INGEST_PASSWORD}
        create_schema: true
        ttl: {{ .Values.clickhouse.retention.logs }}
        logs_table_name: otel_logs
        timeout: 10s
        sending_queue:
          enabled: true
          queue_size: {{ .Values.gateway.queueSize }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 120s
      {{- if .Values.gateway.externalIngest.enabled }}
      # Claude Code's counters (delta sums), for active time and lines.
      clickhouse/metrics:
        endpoint: tcp://drake-otel-clickhouse:9000
        database: otel
        username: drake_ingest
        password: ${env:DRAKE_CH_INGEST_PASSWORD}
        create_schema: true
        ttl: {{ .Values.clickhouse.retention.logs }}
        timeout: 10s
        sending_queue:
          enabled: true
          queue_size: {{ .Values.gateway.queueSize }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 120s
      {{- end }}
      clickhouse/traces:
        endpoint: tcp://drake-otel-clickhouse:9000
        database: otel
        username: drake_ingest
        password: ${env:DRAKE_CH_INGEST_PASSWORD}
        create_schema: true
        ttl: {{ .Values.clickhouse.retention.traces }}
        traces_table_name: otel_traces
        timeout: 10s
        sending_queue:
          enabled: true
          queue_size: {{ .Values.gateway.queueSize }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 120s
    service:
      extensions: [health_check{{ if .Values.gateway.externalIngest.enabled }}, bearertokenauth/external{{ end }}]
      telemetry:
        logs:
          level: warn
        metrics:
          level: none
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/genai-content, transform/redact, batch]
          exporters: [clickhouse/logs]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, {{ if .Values.gateway.selfNamespace }}filter/self-clockwork, {{ end }}resource/cluster, gen_ai_normalizer, transform/genai-content, filter/genai-content, batch]
          exporters: [clickhouse/traces]
        {{- if .Values.gateway.externalIngest.enabled }}
        traces/external:
          receivers: [otlp/external]
          processors: [memory_limiter, resource/external, gen_ai_normalizer, transform/genai-content, filter/genai-content, batch]
          exporters: [clickhouse/traces]
        logs/external:
          receivers: [otlp/external]
          processors: [memory_limiter, filter/claude-code, transform/claude-code, filter/genai-content, transform/redact, resource/external, batch]
          exporters: [clickhouse/logs]
        metrics/external:
          receivers: [otlp/external]
          processors: [memory_limiter, filter/claude-code, transform/claude-code, resource/external, batch]
          exporters: [clickhouse/metrics]
        {{- end }}
