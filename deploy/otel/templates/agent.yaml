{{- include "drake-otel.require" . -}}
# The per-node agent. It READS container log files of allowlisted
# namespaces, enriches them with Kubernetes metadata, and forwards them to
# the gateway. It writes nothing to the node and listens on no port beyond
# its own health check. Datadog reads the same files; neither affects the
# other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drake-otel-agent
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
---
# Exactly what the k8sattributes processor reads to name a pod's owner:
# get/list/watch on pods, namespaces and replicasets. No Secrets, no
# ConfigMaps, no write verb, no wildcard.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-drake-otel-agent-read
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-drake-otel-agent-read
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-drake-otel-agent-read
subjects:
  - kind: ServiceAccount
    name: drake-otel-agent
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drake-otel-agent
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog:
        include:
          {{- range .Values.agent.namespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        exclude:
          # Never collect Drake's own collection pipeline: a collector
          # that reads its own output is a feedback loop.
          - /var/log/pods/{{ .Release.Namespace }}_*/*/*.log
        start_at: {{ .Values.agent.startAt }}
        max_log_size: {{ .Values.agent.maxLogSize }}
        # The container parser reads namespace, pod, pod uid and container
        # name FROM the file path, so the path has to be on the record. It
        # is removed again right after, so it is never stored.
        include_file_path: true
        include_file_name: false
        operators:
          # Parses the CRI/docker line format and sets namespace, pod, pod
          # uid and container name from the file path.
          - type: container
            id: container-parser
          - type: remove
            id: drop-file-path
            field: attributes["log.file.path"]
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.agent.memoryLimitMiB }}
        spike_limit_mib: {{ div .Values.agent.memoryLimitMiB 4 }}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName | quote }}
            action: upsert
      batch:
        send_batch_size: 1000
        timeout: 5s
    exporters:
      otlp:
        endpoint: drake-otel-gateway.{{ .Release.Namespace }}.svc:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 100
        retry_on_failure:
          enabled: true
          max_elapsed_time: 60s
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
        metrics:
          level: none
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resource/cluster, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: drake-otel-agent
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
    app.kubernetes.io/name: drake-otel-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: drake-otel-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "drake-otel.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: drake-otel-agent
      annotations:
        checksum/config: {{ .Values | toJson | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: drake-otel-agent
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Pod log files are root-owned and not world-readable. The agent
        # runs as root to read them, with every capability dropped and a
        # read-only root filesystem: it can read what root owns, and
        # nothing else root could otherwise do.
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: collector
          image: {{ include "drake-otel.image" (dict "root" . "name" "collector") }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            {{- include "drake-otel.securityContext" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          livenessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: drake-otel-agent}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
