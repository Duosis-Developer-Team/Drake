{{- include "drake-otel.require" . -}}
# The gateway: the only component that talks to ClickHouse. Redaction and
# body bounds are applied here, once, before anything is stored (ADR-0029
# §5). Same processors as deploy/local/otel/collector.yaml, which is where
# they are exercised end to end.
apiVersion: v1
kind: Service
metadata:
  name: drake-otel-gateway
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: drake-otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drake-otel-gateway
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
    app.kubernetes.io/name: drake-otel-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: drake-otel-gateway
  template:
    metadata:
      labels:
        {{- include "drake-otel.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: drake-otel-gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      # Next to the store, not on the saturated node.
      nodeSelector:
        {{- toYaml .Values.clickhouse.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # The ClickHouse exporter creates its schema at start-up and exits if
      # the store is not answering yet, so on a fresh install the gateway
      # crash-looped until ClickHouse was up. Waiting here instead turns
      # that into one ordered start. Bounded: after five minutes it fails
      # and Kubernetes retries, rather than waiting forever.
      initContainers:
        - name: wait-for-clickhouse
          image: {{ include "drake-otel.image" (dict "root" . "name" "clickhouse") }}
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 150); do
                wget -q -T 2 -O /dev/null http://drake-otel-clickhouse:8123/ping && exit 0
                sleep 2
              done
              echo "clickhouse did not answer within 5 minutes" >&2
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            {{- include "drake-otel.securityContext" . | nindent 12 }}
      containers:
        - name: collector
          image: {{ include "drake-otel.image" (dict "root" . "name" "collector") }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          env:
            - name: DRAKE_CH_INGEST_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.clickhouse.existingSecret }}, key: ingest-password}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            {{- include "drake-otel.securityContext" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          livenessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
      volumes:
        - name: config
          configMap: {name: drake-otel-gateway}
