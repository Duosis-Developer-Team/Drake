{{- if .Values.obi.enabled }}
{{- include "drake-otel.require" . -}}
{{- if not .Values.obi.namespaces -}}
{{- fail "obi.namespaces is required when obi.enabled: OBI instruments an allowlist of namespaces, never everything" -}}
{{- end -}}
{{- if not .Values.obi.nodeSelector -}}
{{- fail "obi.nodeSelector is required when obi.enabled: OBI runs only on the nodes chosen for it" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: drake-otel-obi
  labels:
    {{- include "drake-otel.labels" . | nindent 4 }}
data:
  obi.yaml: |
    log_level: warn
    # --- Never modify an application -------------------------------------
    # Every key below changes what an instrumented process does or sends,
    # and every one is fixed here rather than offered as a value. The
    # capabilities that would make them possible are not granted either
    # (see obi.yaml), so a mistake in one layer is caught by the other.
    ebpf:
      # Would add a `traceparent` header to outgoing HTTP requests and TCP
      # options to TLS traffic.
      context_propagation: disabled
      track_request_headers: false
      # Would write trace ids into the services' own log output.
      log_enricher:
        services: []
    # Would signal Node.js processes with SIGUSR1 to open the inspector and
    # evaluate an agent inside them (default ON in OBI 1.0).
    nodejs:
      enabled: false
      manual_spans: false
    # Would attach a Java agent to running JVMs (default ON in OBI 1.0).
    javaagent:
      enabled: false
    # --- What to observe -------------------------------------------------
    # An allowlist. A namespace not named here is never instrumented.
    discovery:
      instrument:
        {{- range .Values.obi.namespaces }}
        - k8s_namespace: {{ . | quote }}
        {{- end }}
      # Workloads that trace themselves with an OpenTelemetry SDK. OBI
      # propagates no context, so tracing them too would record every
      # request twice, as two unrelated traces. Named, so the exclusion
      # holds from a pod's first request on.
      exclude_instrument:
        # Pods of CronJob runs. They are short-lived batch processes, most
        # gone within seconds, before OBI can attach: it logged about 350
        # "join target netns" errors an hour for them (2026-11-17), spending
        # CPU on processes that serve no request. Their outgoing calls are
        # recorded where they land, by the service they call. "?*" is one
        # or more characters, so a pod with no CronJob owner never matches.
        - k8s_cronjob_name: "?*"
        {{- range .Values.obi.sdkWorkloads }}
        {{- if not (and .namespace .deployment) }}
        {{- fail "obi.sdkWorkloads entries need both namespace and deployment" }}
        {{- end }}
        - k8s_namespace: {{ .namespace | quote }}
          k8s_deployment_name: {{ .deployment | quote }}
        {{- end }}
      # And the backstop for a workload nobody listed yet: once a process
      # is seen exporting OTLP traces, OBI stops exporting its own for it.
      # This is behavioural, so it only applies after that first export,
      # which is why the list above exists. Stated here, not left as OBI's
      # default.
      exclude_otel_instrumented_services: true
      # One server span per request for Go programs too. With the Go
      # tracers on, OBI recorded every request to minio twice, as two
      # unrelated traces: once from the generic kernel tracer (with the
      # client address and port) and once from the Go uprobes (with
      # neither). Measured 2026-11-16: 958 server spans for 479 requests in
      # an hour. The generic tracer is the one that carries the peer, which
      # Drake needs to recognise a kubelet probe. It is also the one that
      # attaches no uprobes to the application.
      skip_go_specific_tracers: true
    attributes:
      kubernetes:
        enable: "true"
    # --- Where spans go --------------------------------------------------
    # Traces only. No metrics endpoint and no Prometheus port are set, so
    # OBI exports and listens for nothing else.
    otel_traces_export:
      endpoint: http://drake-otel-gateway.{{ .Release.Namespace }}.svc:4317
      protocol: grpc
      # OBI's default trace protocols, plus `genai`: calls to OpenAI,
      # Anthropic, Gemini, Bedrock, Qwen, OpenAI-compatible gateways and
      # MCP, recognised on the wire with no SDK in the application. This is
      # how an agent nobody instrumented still shows up (Tracesis Agent
      # Visibility). Payload extraction stays off: no prompt or answer is
      # read; the gateway would remove one anyway.
      instrumentations:
        - http
        - grpc
        - sql
        - redis
        - kafka
        - mqtt
        - nats
        - amqp
        - mongo
        - couchbase
        - memcached
        - sunrpc
        - aerospike
        - genai
{{- end }}
