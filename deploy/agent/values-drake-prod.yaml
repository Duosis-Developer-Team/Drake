# Drake cluster agent — the duosis-prod-1 install.
#
# `values.yaml` next door is the reusable template and is deliberately
# unpinned; this file is the production decision, and it belongs under
# review for the same reason `values-drake-prod.yaml` does for the control
# plane.
#
# It contains NO credential material. The two Secrets are referenced by
# name and created out of band by the operator: the enrollment token is
# one-time and short-lived, and the agent's private key is generated inside
# the agent and never leaves it.
#
# Every address below was read from the live cluster, read-only, on
# 2026-08-11 — not copied from a chart default.

# The published agent package is private, exactly like the API and web
# ones, so the agent's namespace needs its own copy of the pull credential
# — a Secret is namespaced, and `drake-ghcr` in `drake-prod` is invisible
# from here. Created out of band; this file names it and nothing more.
imagePullSecrets:
  - drake-ghcr

image:
  repository: ghcr.io/duosis-developer-team/drake-cluster-agent
  # Source commit 76b3be91e43e1b6be2ffb6100b282caa44e46b4f, publish run
  # 31890748234 — the same commit and the same run that produced the API
  # and web images this control plane runs.
  #
  # This bump is the one that matters for the agent: osv-scanner reported
  # eight advisories against Go stdlib 1.26.5, and the agent is a static Go
  # binary running in someone else's cluster. Nothing in the API or web
  # images carried those. The digest it replaces — `842357ff…daaa7`,
  # main@6848606, publish run 31517960078 — is the rollback target and is
  # what the live Deployment ran when this line was edited.
  digest: "sha256:ed081776934c3c20107255d9aa6db2440b2e9244cff38369f98c6ed4d571564c"
  pullPolicy: IfNotPresent

# Supplied at install time from the catalog row created during enrollment.
# The UUID is generated by Drake, so it cannot be committed before the
# cluster exists; `clusterName` is the documented, stable decision and is
# recorded here so the install does not have to re-derive it.
clusterId: ""
clusterName: duosis-prod-1

# The internal listener, ClusterIP-only. TWO endpoints, because the two
# listeners enforce different client-certificate policies and pointing both
# at one port fails in a way that looks like a network problem:
#   enroll :8144  CERT_NONE      — the one pre-certificate call
#   ingest :8143  CERT_REQUIRED  — everything afterwards
apiBaseUrl: https://drake-agent-gateway.drake-prod.svc.cluster.local:8143
enrollmentBaseUrl: https://drake-agent-gateway.drake-prod.svc.cluster.local:8144

# Existing Secrets ONLY. The chart never templates credential material.
serverCA:
  # The INTERNAL SERVER CA bundle — `CN=Drake Internal Server CA`, which
  # signs the listener's server certificate. This is NOT `drake-agent-ca`
  # (`CN=Drake Agent CA`), which signs agent CLIENT certificates. The two
  # are separate trust domains and swapping them produces a TLS failure
  # that reads like a bad address.
  existingSecret: drake-agent-server-ca
  key: ca.pem
enrollmentToken:
  existingSecret: drake-agent-enrollment
  key: token

# The agent's identity must survive a restart, or every node drain would
# need a fresh one-time enrollment token.
persistence:
  enabled: true
  storageClass: local-path
  size: 64Mi

logLevel: info

networkPolicy:
  enabled: true
  # The gateway, named by what it IS rather than by the address it happens
  # to answer on today. This file used to carry the Service ClusterIP as a
  # /32; revision 13 deleted and recreated that Service, the ClusterIP moved
  # from 10.233.43.18 to 10.233.48.114, and the committed rule was left
  # pointing at nothing — before the agent was ever installed, so nobody
  # would have found out from a failure that looked like anything but DNS.
  # Labels do not move when a Service is rebuilt.
  gatewayNamespace: drake-prod
  gatewayPodSelector:
    app.kubernetes.io/name: drake
    app.kubernetes.io/component: agent-gateway
  # Both listener ports, because the listeners differ in client-certificate
  # policy: enroll 8144 CERT_NONE, ingest 8143 CERT_REQUIRED. With only
  # 8143 allowed the agent could never make its one pre-certificate call.
  apiEndpointPort: 8143
  enrollmentPort: 8144
  # The REAL apiserver endpoint, not the in-cluster service VIP — an
  # egress policy matches the address after DNAT.
  # `kubectl get endpoints kubernetes` -> 84.247.180.172:6443
  kubernetesApiCIDR: 84.247.180.172/32
  kubernetesApiPort: 6443
  dnsNamespace: kube-system
  dnsPodSelector: "k8s-app: kube-dns"
  # This cluster runs kubespray's node-local DNS cache: pods resolve
  # against 169.254.25.10, a link-local address on the node itself, so the
  # kube-dns pod selector above matches none of the agent's lookups.
  # Read from a running pod's /etc/resolv.conf, not assumed.
  dnsExtraCIDRs:
    - 169.254.25.10/32
