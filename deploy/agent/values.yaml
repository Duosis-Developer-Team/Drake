# Drake cluster agent — reusable, UNAPPLIED template.
# This chart is rendered and policy-checked in CI; it is never installed on
# a real or shared cluster by the repository itself. Disposable test
# clusters are the only sanctioned apply target during acceptance runs.

image:
  repository: ghcr.io/duosis-developer-team/drake-cluster-agent
  # Digest-pinned at deploy time by the operator; the empty default keeps
  # accidental installs from pulling a floating tag. Built from
  # apps/cluster-agent/Dockerfile (binary at /usr/local/bin/drake-agent
  # with a `healthcheck` subcommand — the liveness contract).
  digest: ""
  # devTag is ONLY for disposable smoke clusters with locally imported
  # images (pullPolicy Never); production renders fail without a digest.
  devTag: ""
  pullPolicy: IfNotPresent

# Drake cluster identity (UUID from the Drake catalog).
# Where the ONE pre-certificate call goes. Empty means "the same listener
# as apiBaseUrl", which is what local, test and CI want. Production points
# it at the enrollment listener, because the ingest listener refuses a
# connection that presents no client certificate.
enrollmentBaseUrl: ""

# The agent's identity must survive a restart, or every node drain needs a
# new one-time enrollment token.
persistence:
  enabled: true
  # Leave empty to let the chart create the claim.
  existingClaim: ""
  storageClass: ""
  size: 64Mi

clusterId: ""
clusterName: ""

# Outbound-only internal API endpoint (HTTPS).
apiBaseUrl: ""

# Existing Secrets ONLY — this chart never templates credential material.
# Each secret is created out-of-band by the operator.
serverCA:
  existingSecret: ""   # secret with the internal listener CA bundle
  key: ca.pem
enrollmentToken:
  existingSecret: ""   # one-time token; consumed at first start, then inert
  key: token

logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Loopback liveness probe port (never exposed via Service; no Service exists).
healthPort: 8090

networkPolicy:
  enabled: true
  # FAIL-CLOSED egress: every destination is explicit. Rendering fails on
  # empty values, and the policy gate refuses 0.0.0.0/0 and ::/0 — "the
  # whole internet" is never a reviewable destination.
  #
  # The Drake gateway is named in exactly ONE of two ways. Naming both is
  # refused, because a render cannot decide which one was meant:
  #
  #   IN-CLUSTER (production) — gatewayNamespace + gatewayPodSelector.
  #     Prefer this. A Service ClusterIP is not a stable identifier: delete
  #     and recreate the Service and the address changes, leaving a
  #     committed CIDR aimed at nothing. Egress matches the destination
  #     after DNAT, so pod labels are what the packet is judged against
  #     anyway, and they outlive the Service object.
  #
  #   OFF-CLUSTER (k3d smokes, host-run listeners) — apiEndpointCIDR.
  #     A listener that is not a pod cannot be selected by labels.
  gatewayNamespace: ""
  gatewayPodSelector: {}
  apiEndpointCIDR: ""
  # The ingest listener's port. `enrollmentPort` is rendered ALONGSIDE it
  # when the two differ: production enrolls on 8144 (CERT_NONE) and ingests
  # on 8143 (CERT_REQUIRED), so a policy carrying only one of them lets the
  # agent enrol and then go silent, or never enrol at all. Empty means one
  # listener serves both calls, which is what local and CI run.
  apiEndpointPort: 443
  enrollmentPort: ""
  # The Kubernetes API: egress policies match the POST-DNAT destination,
  # so this must cover the REAL apiserver endpoint addresses
  # (`kubectl get endpoints kubernetes`), not the in-cluster service VIP.
  kubernetesApiCIDR: ""
  kubernetesApiPort: 6443
  # Cluster DNS: restricted to the kube-dns service pods, not "any:53".
  dnsNamespace: kube-system
  dnsPodSelector: "k8s-app: kube-dns"
  # Node-local DNS caches (kubespray's `nodelocaldns`, and equivalents)
  # answer on a link-local address owned by the node, not by any pod, so
  # the selector above cannot name them. List them per cluster as /32s
  # ONLY where the kubelet hands pods such a resolver — an empty list is
  # the correct default.
  dnsExtraCIDRs: []

serviceAccount:
  name: drake-cluster-agent
