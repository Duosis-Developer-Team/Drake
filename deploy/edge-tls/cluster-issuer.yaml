# Let's Encrypt production. The account key is generated by cert-manager
# into `cert-manager/letsencrypt-prod-account-key` and never leaves the
# cluster.
#
# The solver deliberately names `nginx`, the SHARED controller: it owns
# node2's port 80, which is where an HTTP-01 challenge for
# `drake-84-247-180-173.sslip.io` arrives, and it watches every namespace
# — so the solver Ingress is created in the Certificate's own namespace
# rather than in `hermes-test`, whose controller owns node1's port 80.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: akadir1256@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
