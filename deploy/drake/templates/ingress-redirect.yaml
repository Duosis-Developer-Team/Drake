{{- if and .Values.ingress.enabled (eq (include "drake.ingressMode" .) "true") .Values.ingress.redirectHosts }}
{{- $origin := include "drake.publicOrigin" . }}
{{- $class := ternary .Values.edge.dedicatedController.ingressClassName .Values.ingress.className .Values.edge.dedicatedController.enabled }}
{{/*
Former names of this deployment. A browser that still has one is sent,
path and query kept, to the canonical origin with a permanent (308)
redirect — bookmarks keep working and nothing is served twice.

`ingress.redirectKeepPaths` are the exception: paths still answered on the
old name, unredirected, because their callers do not follow redirects.
GitHub delivers webhooks to the URL in the App's settings and treats a 3xx
as a failure, so `/v1/github/` keeps working on the old name until that
setting points at the new one.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "drake.name" . }}-redirect
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: {{ printf "%s$request_uri" $origin | quote }}
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  ingressClassName: {{ $class | quote }}
  {{- if and .Values.ingress.tls.enabled (eq .Values.ingress.tls.mode "secret") }}
  tls:
    - hosts:
        {{- range .Values.ingress.redirectHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    {{- range .Values.ingress.redirectHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "drake.name" $ }}-web
                port:
                  number: {{ $.Values.web.port }}
    {{- end }}
{{- if .Values.ingress.redirectKeepPaths }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "drake.name" . }}-redirect-keep
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ $class | quote }}
  {{- if and .Values.ingress.tls.enabled (eq .Values.ingress.tls.mode "secret") }}
  tls:
    - hosts:
        {{- range .Values.ingress.redirectHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    {{- range $host := .Values.ingress.redirectHosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $.Values.ingress.redirectKeepPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "drake.name" $ }}-api
                port:
                  number: {{ $.Values.api.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
