{{- include "drake.validateAll" . }}
{{- if and (eq (include "drake.ingressMode" .) "true") .Values.edge.dedicatedController.enabled }}
{{- $c := .Values.edge.dedicatedController }}
{{- $name := printf "%s-edge" (include "drake.name" .) }}
{{/*
Drake's own ingress-nginx.

The cluster already runs shared controllers that other applications depend
on, and one of them publishes a hostless catch-all Ingress — so Drake
cannot add rules there without competing for `/`. Rather than touch
infrastructure other teams rely on, Drake runs its own controller, watching
only its own IngressClass, with its own leader-election lease and its own
NodePort. Nothing here reads or writes another controller's resources.

Only the HTTPS port is published. TLS terminates here on the controller's
self-signed default certificate, which is the same arrangement the existing
applications use today: browsers will warn, and that is a known and
accepted state, not an oversight.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
rules:
  - apiGroups: [""]
    resources: [configmaps, endpoints, nodes, pods, secrets, namespaces]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ include "drake.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "drake.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps, pods, secrets, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  # Its own lease, named below; it cannot take another controller's.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, update, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "drake.namespace" . }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ $c.ingressClassName }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  # Deliberately NOT the default class: a controller that claims unlabelled
  # Ingresses cluster-wide would start serving other teams' resources.
  controller: {{ $c.controllerClass }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
data:
  # The client's address and protocol must survive the hop, or the API
  # cannot tell https from http and every redirect it builds is wrong.
  use-forwarded-headers: "true"
  # Only this controller's own hop is trusted for those headers.
  proxy-real-ip-cidr: "0.0.0.0/0"
  allow-snippet-annotations: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  type: NodePort
  # HTTPS only. No plaintext port is published: an http listener on a
  # public node port is a way in that nobody asked for.
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
      nodePort: {{ $c.httpsNodePort }}
  selector:
    app.kubernetes.io/name: {{ include "drake.name" . }}
    app.kubernetes.io/component: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "drake.name" . }}
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "drake.name" . }}
        app.kubernetes.io/component: edge
    spec:
      {{- include "drake.imagePullSecrets" . | nindent 6 }}
      # Same reason as every other Drake pod: the injected DRAKE_* service
      # links are noise here, and Drake's own pods parse DRAKE_ variables.
      enableServiceLinks: false
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ printf "%s@%s" $c.image.repository $c.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - /nginx-ingress-controller
            - --publish-service=$(POD_NAMESPACE)/{{ $name }}
            - --election-id={{ $name }}-leader
            - --controller-class={{ $c.controllerClass }}
            - --ingress-class={{ $c.ingressClassName }}
            # Scoped to Drake's namespace, so this controller cannot read
            # or serve another application's Ingress even by accident.
            - --watch-namespace=$(POD_NAMESPACE)
            - --configmap=$(POD_NAMESPACE)/{{ $name }}
            # No admission webhook: it would need a Service and a
            # certificate of its own, for validation Drake does not need.
            - --validating-webhook=
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LD_PRELOAD
              value: /usr/local/lib/libmimalloc.so
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: metrics
              containerPort: 10254
          livenessProbe:
            httpGet: {path: /healthz, port: 10254, scheme: HTTP}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /healthz, port: 10254, scheme: HTTP}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $c.resources | nindent 12 }}
{{- end }}
