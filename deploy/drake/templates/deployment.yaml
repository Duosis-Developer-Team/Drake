{{- include "drake.validateAll" . }}
{{- $host := include "drake.publicHost" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drake.name" . }}-api
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "drake.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "drake.name" . }}
        app.kubernetes.io/component: api
    spec:
      {{- include "drake.imagePullSecrets" . | nindent 6 }}
      # Kubernetes injects a legacy Docker-style env var per Service in the
      # namespace. The Service named `drake-api` produces
      # DRAKE_API_PORT=tcp://<clusterIP>:8000, and Drake reads DRAKE_*
      # settings — so that variable arrives as `api_port` and the process
      # dies parsing "tcp://..." as an integer before it ever serves.
      #
      # Drake finds its peers through DNS and reads none of these, so they
      # are switched off rather than worked around. Not configurable: an
      # option here would only offer a way to reintroduce the crash.
      enableServiceLinks: false
      {{- with .Values.api.affinity }}
      # Where the scheduler should prefer to put this pod. Optional; a
      # preference (not a requirement) so a full node never leaves it
      # unscheduled.
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        {{- if or .Values.github.enabled ((.Values.alerting).existingSecret) }}
        # The GitHub App's private key and webhook secret arrive as a Secret
        # volume, and Kubernetes gives those files to root. Without an
        # fsGroup this process (uid 65532) cannot read them at any mode
        # tighter than world-readable — the same defect that crash-looped
        # the internal listener on its CA bundle. fsGroup makes the volume
        # group-owned by this gid so 0440 is readable here and by nobody
        # else; 0444 would leave an App private key readable by any uid in
        # the pod.
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ include "drake.image" (dict "ctx" . "image" .Values.api.image "name" "api") | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: DRAKE_ENV
              value: production
            # Every externally visible URL derives from this one value, not
            # from the incoming request.
            - name: DRAKE_PUBLIC_ORIGIN
              value: {{ include "drake.publicOrigin" . | quote }}
            - name: DRAKE_AUTH_MODE
              value: {{ (.Values.auth).mode | default "oidc" | quote }}
            # Exactly one proxy hop: the ingress controller. Forwarded
            # headers from anywhere else are not trusted.
            {{- include "drake.productionSecurityEnv" . | nindent 12 }}
            - name: DRAKE_OIDC_REDIRECT_URL
              value: {{ printf "%s/v1/auth/callback" (include "drake.publicOrigin" .) | quote }}
            - name: DRAKE_API_HOST
              value: "0.0.0.0"
            {{- if (.Values.alerting).integrations }}
            - name: DRAKE_ALERTMANAGER_INTEGRATIONS
              value: {{ include "drake.alertmanagerIntegrations" . | quote }}
            {{- end }}
            {{- if (.Values.telemetry).connectors }}
            - name: DRAKE_TELEMETRY_CONNECTORS
              value: {{ include "drake.telemetryConnectors" . | quote }}
            {{- end }}
            - name: DRAKE_GITHUB_APP_ENABLED
              value: {{ .Values.github.enabled | quote }}
            {{- if .Values.github.enabled }}
            # Paths, not material. The API loads both from disk, so the
            # private key and the webhook secret never appear in the
            # process environment.
            - name: DRAKE_GITHUB_APP_PRIVATE_KEY_FILE
              value: {{ printf "%s/private-key.pem" .Values.github.secretMountPath | quote }}
            - name: DRAKE_GITHUB_WEBHOOK_SECRET_FILE
              value: {{ printf "%s/webhook-secret" .Values.github.secretMountPath | quote }}
            {{- if .Values.github.appId }}
            - name: DRAKE_GITHUB_APP_ID
              value: {{ .Values.github.appId | quote }}
            {{- end }}
            {{- if .Values.github.clientId }}
            - name: DRAKE_GITHUB_APP_CLIENT_ID
              value: {{ .Values.github.clientId | quote }}
            {{- end }}
            {{- end }}
            - name: DRAKE_GITHUB_GITOPS_PR_ENABLED
              value: {{ .Values.github.gitopsPrEnabled | quote }}
            - name: DRAKE_GITOPS_WORKER_ENABLED
              value: {{ .Values.github.workerEnabled | quote }}
            # Stated unconditionally, both states. A flag the chart can only
            # turn ON is a flag that cannot be turned OFF once a values file
            # has set it, and "absent" would then mean "whatever the image
            # defaults to" rather than what this release decided.
            - name: DRAKE_DEPLOYMENT_INGEST_ENABLED
              value: {{ .Values.deployments.ingestEnabled | quote }}
            - name: DRAKE_DEPLOYMENT_INGEST_INTERVAL_SECONDS
              value: {{ .Values.deployments.ingestIntervalSeconds | quote }}
            # Stated in both states, like the deployment ingest flag.
            - name: DRAKE_INCIDENT_RUNNER_ENABLED
              value: {{ (.Values.incidents).runnerEnabled | default false | quote }}
            - name: DRAKE_INCIDENT_RUNNER_INTERVAL_SECONDS
              value: {{ (.Values.incidents).runnerIntervalSeconds | default 120 | quote }}
            # Stated in both states. With traces on, it also keeps the
            # five-minute request counts objectives are judged on.
            # Agent Visibility: the discovery loop (both states) and where an
            # agent-running system sends traces, shown on the Agents screen.
            - name: DRAKE_AGENT_DISCOVERY_ENABLED
              value: {{ (.Values.agents).discoveryEnabled | default false | quote }}
            - name: DRAKE_AGENT_CLUSTER_ENDPOINT
              value: {{ (.Values.agents).clusterEndpoint | default "http://drake-otel-gateway.drake-otel.svc:4318" | quote }}
            - name: DRAKE_AGENT_EXTERNAL_INGEST
              value: {{ (.Values.agentIngest).enabled | default false | quote }}
            - name: DRAKE_AGENT_PRICES_ENABLED
              value: {{ (.Values.agents).pricesEnabled | default false | quote }}
            - name: DRAKE_AGENT_GUARDRAILS_ENABLED
              value: {{ (.Values.agents).guardrailsEnabled | default false | quote }}
            - name: DRAKE_SLO_EVALUATOR_ENABLED
              value: {{ (.Values.slo).evaluatorEnabled | default false | quote }}
            - name: DRAKE_SLO_EVALUATOR_INTERVAL_SECONDS
              value: {{ (.Values.slo).evaluatorIntervalSeconds | default 300 | quote }}
            # Stated in both states, like the incident runner.
            - name: DRAKE_NOTIFICATION_PLANNER_ENABLED
              value: {{ (.Values.notifications).plannerEnabled | default false | quote }}
            - name: DRAKE_WEBHOOK_WORKER_ENABLED
              value: {{ (.Values.notifications).deliveryEnabled | default false | quote }}
            {{- $email := (.Values.notifications).email | default dict }}
            {{- $emailSender := and $email.sender $email.sender.address }}
            {{- if $emailSender }}
            - name: DRAKE_NOTIFICATION_EMAIL_SENDER
              value: {{ include "drake.emailSender" . | quote }}
            {{- end }}
            {{- if $email.destinations }}
            - name: DRAKE_NOTIFICATION_EMAILS
              value: {{ include "drake.emailDestinations" . | quote }}
            {{- end }}
            # Stated in both states. Judges every backup policy on a timer and
            # creates the policies declared for each registered reporter.
            - name: DRAKE_PROTECTION_EVALUATION_ENABLED
              value: {{ (.Values.protection).evaluationEnabled | default false | quote }}
            - name: DRAKE_PROTECTION_EVALUATION_INTERVAL_SECONDS
              value: {{ (.Values.protection).evaluationIntervalSeconds | default 300 | quote }}
            {{- if (.Values.protection).connectors }}
            - name: DRAKE_PROTECTION_CONNECTORS
              value: {{ include "drake.protectionConnectors" . | quote }}
            {{- end }}
            - name: DRAKE_OBSERVABILITY_LOGS_ENABLED
              value: {{ (.Values.observability).logsEnabled | default false | quote }}
            - name: DRAKE_OBSERVABILITY_TRACES_ENABLED
              value: {{ (.Values.observability).tracesEnabled | default false | quote }}
            {{- if or (.Values.observability).logsEnabled (.Values.observability).tracesEnabled }}
            - name: DRAKE_OBSERVABILITY_STORE
              value: {{ include "drake.observabilityStore" . | quote }}
            {{- end }}
          envFrom:
            # Secret REFERENCES only; no value is ever rendered here.
            - secretRef:
                name: {{ .Values.api.existingSecret | default (printf "%s-api" (include "drake.name" .)) }}
          {{- $observability := or ((.Values.observability).logsEnabled) ((.Values.observability).tracesEnabled) }}
          {{- $emailMount := $emailSender }}
          {{- $reporters := (.Values.protection).connectors }}
          {{- $secretVolumes := or .Values.github.enabled ((.Values.alerting).existingSecret) $observability $emailMount $reporters }}
          {{- if $secretVolumes }}
          volumeMounts:
            {{- if $observability }}
            - name: observability-store
              mountPath: {{ .Values.observability.secretMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.github.enabled }}
            - name: github-app
              mountPath: {{ .Values.github.secretMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- range $key, $connector := $reporters }}
            - name: {{ printf "protection-%s" $key | trunc 63 | trimSuffix "-" }}
              mountPath: {{ printf "%s/%s" ($.Values.protection.secretMountPath | default "/etc/drake/protection") $key | quote }}
              readOnly: true
            {{- end }}
            {{- if (.Values.alerting).existingSecret }}
            - name: alertmanager-tokens
              mountPath: {{ (.Values.alerting).secretMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $emailMount }}
            - name: email-sender
              mountPath: {{ $email.secretMountPath | default "/etc/drake/email" | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if or .Values.github.enabled ((.Values.alerting).existingSecret) ((.Values.observability).logsEnabled) ((.Values.observability).tracesEnabled) $emailMount }}
      volumes:
        {{- if or ((.Values.observability).logsEnabled) ((.Values.observability).tracesEnabled) }}
        - name: observability-store
          secret:
            secretName: {{ required "observability.existingSecret is required when observability.logsEnabled or tracesEnabled" .Values.observability.existingSecret }}
            items:
              - {key: reader-password, path: reader-password}
            # Same 0440 + fsGroup contract as the other credential mounts.
            defaultMode: 0440
        {{- end }}
        {{- range $key, $connector := (.Values.protection).connectors }}
        - name: {{ printf "protection-%s" $key | trunc 63 | trimSuffix "-" }}
          secret:
            secretName: {{ required (printf "protection.connectors.%s.existingSecret is required" $key) $connector.existingSecret }}
            items:
              - {key: signing-secret, path: signing-secret}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.github.enabled }}
        - name: github-app
          secret:
            secretName: {{ required "github.existingSecret is required when github.enabled" .Values.github.existingSecret }}
            # 0440, not 0400: with the fsGroup above, the owning group is
            # this process's gid, so it can read the files while no other
            # uid in the pod can. 0400 renders, installs, and then fails at
            # the first read — the worst place to find out.
            defaultMode: 0440
        {{- end }}
        {{- if (.Values.alerting).existingSecret }}
        - name: alertmanager-tokens
          secret:
            secretName: {{ (.Values.alerting).existingSecret }}
            # Same 0440 + fsGroup contract as the App key: a Secret volume
            # is root-owned, and 0400 would render, install and then fail at
            # the first read.
            defaultMode: 0440
        {{- end }}
        {{- if $emailMount }}
        - name: email-sender
          secret:
            secretName: {{ required "notifications.email.existingSecret is required when an e-mail sender address is set" $email.existingSecret }}
            items:
              - {key: client-secret, path: client-secret}
            # Same 0440 + fsGroup contract as the other credential mounts.
            defaultMode: 0440
        {{- end }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drake.name" . }}-web
  namespace: {{ include "drake.namespace" . }}
  labels:
    {{- include "drake.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "drake.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "drake.name" . }}
        app.kubernetes.io/component: web
    spec:
      {{- include "drake.imagePullSecrets" . | nindent 6 }}
      # Kubernetes injects a legacy Docker-style env var per Service in the
      # namespace. The Service named `drake-api` produces
      # DRAKE_API_PORT=tcp://<clusterIP>:8000, and Drake reads DRAKE_*
      # settings — so that variable arrives as `api_port` and the process
      # dies parsing "tcp://..." as an integer before it ever serves.
      #
      # Drake finds its peers through DNS and reads none of these, so they
      # are switched off rather than worked around. Not configurable: an
      # option here would only offer a way to reintroduce the crash.
      enableServiceLinks: false
      {{- with .Values.web.affinity }}
      # Where the scheduler should prefer to put this pod. Optional; a
      # preference (not a requirement) so a full node never leaves it
      # unscheduled.
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ include "drake.image" (dict "ctx" . "image" .Values.web.image "name" "web") | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: NODE_ENV
              value: production
            # Deliberately NO DRAKE_API_URL and no NEXT_PUBLIC_* API origin.
            # In production the browser calls same-origin /v1 and the
            # ingress routes it straight to the API; the web container
            # never proxies API traffic.
            - name: DRAKE_DEPLOYMENT_MODE
              value: production
          # Next serves / as soon as it is listening. Without a readiness
          # probe a rolling update routes traffic to a pod that has not
          # finished starting, and the first users of a new release get
          # connection resets.
          livenessProbe:
            httpGet: {path: /, port: http}
          readinessProbe:
            httpGet: {path: /, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
