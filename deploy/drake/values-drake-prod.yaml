# Drake production values — drake-prod namespace, first deployment.
#
# This file is committed on purpose: it contains no secret value, only the
# NAMES of Secrets created out of band, and the shape of the release. What
# it does contain is the deployment decision, which belongs under review.
#
# Images are pinned to real digests published from main@78b8503 by publish
# run 31530918769. All three — API, web and migration — were built from
# that one commit, so they cannot drift apart.
#
# The digests these replaced (API `8c401467…706c`, web `5f6113ea…0076`)
# named main@c36f43f. The web digest was what revision 12 actually ran; the
# API digest was NOT — revision 12 served `7b02b3fe…4341`, applied from a
# later build than this file recorded. So this file has described the API
# inaccurately since then, and the fix is this update rather than a note:
# a committed pin is only useful if it says what is deployed.
#
# Nothing is left blank: the datastores are selected by label rather than
# by address, so this file is complete as committed.
#
# Everything else here is deliberate and should not be changed casually.

deploymentMode: production

# This deployment IS published, and has been since the first install.
#
# An earlier revision of this file set `edge.mode: internal` on the theory
# that the rollout had not published a route yet. It had: the live release
# serves https://drake-84-247-180-172.sslip.io:30773/ through Drake's own
# controller, and installing the internal profile over it would have
# deleted the Ingress, the IngressClass and the edge Service and taken the
# origin down. The mode here has to describe the deployment that exists,
# not the one the file was first written for.
edge:
  mode: ingress
  # Drake's own controller. The shared ones already serve other
  # applications, and one publishes a hostless catch-all Ingress, so Drake
  # cannot add rules there without competing for `/`.
  dedicatedController:
    enabled: true
    ingressClassName: drake-nginx
    controllerClass: k8s.io/drake-nginx
    replicas: 1
    # The only port Drake publishes. HTTPS only; verified free cluster-wide
    # and from outside before it was chosen, and in use by this deployment
    # today.
    httpsNodePort: 30773
    image:
      repository: registry.k8s.io/ingress-nginx/controller
      # Same build the cluster's existing controllers run, pinned.
      digest: "sha256:f95a79b85fb93ac3de752c71a5c27d5ceae10a18b61904dec224c1c6a4581e47"

ingress:
  enabled: true
  className: drake-nginx
  # node2's sslip.io name, not node1's, and the reason is ACME.
  #
  # This deployment has no purchased domain, and a self-signed certificate
  # is not merely a browser warning: GitHub refuses to deliver a webhook to
  # one, and repository discovery has no other trigger, so the catalog
  # cannot be populated at all.
  #
  # sslip.io names are real public DNS, so Let's Encrypt can issue for
  # them — but HTTP-01 has to answer on port 80 of the address the name
  # resolves to. On node1 both 80 and 443 are already REDIRECTed to
  # Hermes' NodePorts, and the controller that owns them watches only
  # `hermes-test`, so solving there would mean writing into another team's
  # namespace. node2's 80 belongs to the shared `nginx` controller, which
  # watches every namespace — the solver Ingress lives in drake-prod and
  # nothing of Hermes' is touched.
  #
  # The certificate is bound to the NAME, not the port, so the NodePort
  # below is unaffected. When a purchased domain arrives, this host and
  # the Certificate's dnsName change together and nothing else does.
  host: drake-84-247-180-173.sslip.io
  tls:
    enabled: true
    mode: secret
    # Issued by cert-manager from `deploy/edge-tls/`, renewed automatically.
    secretName: drake-edge-tls

# The deployment's identity, not merely its address: the session cookie,
# the CSRF origin comparison and the OIDC redirect URL all derive from it,
# and the API refuses to start in production without a valid https origin.
#
# It carries the port because the route is a NodePort, and the browser is
# told this exact origin.
publicOrigin: https://drake-84-247-180-173.sslip.io:30773

# Drake's GHCR packages are private. Without this every pod stops at
# ImagePullBackOff. Created out of band:
#   kubectl -n drake-prod create secret docker-registry drake-ghcr ...
imagePullSecrets:
  - drake-ghcr

api:
  replicas: 2
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Source commit 78b85037a54183b75ff64409d0f6e5c8890bf85c
    # Published as the tag of the same name; pinned here by digest because
    # the chart accepts only one immutable reference in production, and a
    # tag — even a commit-SHA tag — can in principle be repointed.
    digest: "sha256:118332df48e26303bc5cf05ff60f561c9cf4a0adafd952ca4899a92afba63c39"
  # Created out of band; see docs/runbooks/STANDARD_KUBERNETES_DEPLOYMENT.md
  # for the exact key list. The chart creates no Secret.
  existingSecret: drake-api-config
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

web:
  replicas: 2
  image:
    repository: ghcr.io/duosis-developer-team/drake-web
    # Source commit 78b85037a54183b75ff64409d0f6e5c8890bf85c
    digest: "sha256:491e8b3ffa08efe4af2d0b79dd55703942c58eaa950fe9859b07f85ef79d44a4"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

migration:
  enabled: true
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Same digest as the API: the migration must run the exact code that
    # is about to serve.
    digest: "sha256:118332df48e26303bc5cf05ff60f561c9cf4a0adafd952ca4899a92afba63c39"
  backoffLimit: 0

networkPolicy:
  # The target cluster runs Flannel with no policy controller, so nothing
  # enforces these today. They are declarative intent and must not be
  # counted as a control until an enforcing CNI is present. They are still
  # written correctly, so that the day one appears, Drake keeps working.
  enabled: true
  # Selected by label, so a rescheduled datastore pod keeps its access and
  # no ClusterIP or pod address is ever hard-coded. These labels must match
  # the datastore pods deployed alongside Drake.
  database:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: drake-postgres
    port: 5432
  redis:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: drake-redis
    port: 6379
  # The cluster's resolver, verified read-only on the target cluster:
  # CoreDNS pods carry k8s-app=kube-dns in kube-system, and the namespace
  # carries the standard kubernetes.io/metadata.name label.
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    port: 53
  # Still empty, and now for a narrower reason than "Drake calls nobody":
  # GitHub is reached over the public internet, which needs no rule here
  # because this policy governs egress the cluster can express — and the
  # metrics backend it does need is in-cluster, so it belongs below.
  apiExternalEgress: []

  # Prometheus, by namespace and pod labels rather than by the ClusterIP the
  # connector URL happens to name — the address is pinned for Drake's SSRF
  # check, but a policy that also depended on it would break the day the
  # Service is recreated, which is exactly what happened to the agent.
  apiClusterEgress:
    - namespace: drake-monitoring
      podSelector:
        app.kubernetes.io/name: prometheus
      port: 9090

# The internal agent listener. ClusterIP-only; never published.
#
# This block was MISSING from this file while revision 12 ran the listener
# in the cluster, so the committed values did not describe the deployment —
# the same divergence as the API digest above, and with a sharper edge: the
# chart defaults `enabled` to false, so the first upgrade that used only
# this file DELETED the running `drake-agent-gateway` Deployment, Service
# and NetworkPolicies. It did (revision 13, 2026-08-11), and this restores
# it. Nothing user-facing was affected — the listener is internal — but the
# lesson is that an omitted block is an instruction, not a silence.
#
# Both Secrets already exist in the namespace, created out of band, and the
# chart creates neither:
#   drake-agent-tls  kubernetes.io/tls  tls.crt + tls.key
#   drake-agent-ca   Opaque             ca.crt  + ca.key
#
# They are two DIFFERENT trust domains and must not be conflated: the
# listener's server certificate is signed by `CN=Drake Internal Server CA`,
# while `drake-agent-ca` (`CN=Drake Agent CA`) signs agent CLIENT
# certificates.
internalAgentApi:
  enabled: true
  tlsSecret: drake-agent-tls
  caSecret: drake-agent-ca

# Email and password, verified by Drake. The Entra app registration is
# kept but not used at runtime; switching back is a one-value change.
auth:
  mode: local

# The App exists now: `drake-duosis-production`, owned by
# Duosis-Developer-Team, installed on exactly three repositories with four
# read permissions (metadata, contents, administration, actions) and two
# events (repository, push). Verified against the GitHub API rather than
# read off the settings screen.
#
# Read-only stays read-only: `gitopsPrEnabled` and `workerEnabled` remain
# off, so no branch, commit or pull request can be created in any
# repository. They are one decision and the chart refuses half of it —
# one alone would either accept proposals nothing delivers, or run a
# worker nothing can reach.
#
# Only IDENTIFIERS live here. The private key and the webhook secret are in
# `drake-github-app`, created out of band and mounted as files, because a
# settings value can end up in `kubectl describe pod`, a crash dump or a
# child process environment; a file cannot.
# The metrics backend, installed by deploy/monitoring/. The address is the
# Service's PINNED ClusterIP: Drake refuses hostname connectors in
# production, and an unpinned ClusterIP is the same trap the agent's egress
# rule fell into. Both opt-ins are stated rather than defaulted — this is
# plaintext to a private address, and each half is a decision.
telemetry:
  connectors:
    duosis-prod-1:
      url: http://10.233.0.42
      allowPrivate: true
      allowPlaintext: true

# ON here because this deployment has an agent enrolled and reporting fresh
# inventory, which is the only precondition. It grants no new access: the
# ingest reads rows the agent already wrote and calls neither Kubernetes nor
# GitHub.
#
# Until this was wired, the chart had no way to set the flag at all, so the
# API fell back to its `False` default and deployment history stayed dark in
# production while the data it needed was already arriving. That is the same
# failure as the missing `internalAgentApi` block above: the code was
# present, the deployment simply never said to run it.
deployments:
  ingestEnabled: true

github:
  enabled: true
  existingSecret: drake-github-app
  # GitHub recommends the client id as the JWT issuer. The numeric app id
  # is recorded alongside it because the installation and the audit trail
  # are keyed on it, and reading it out of a settings screen later is how
  # the wrong App gets debugged for an hour.
  clientId: "Iv23lihz94WBYwjFSnOu"
  appId: "4559623"
  gitopsPrEnabled: false
  workerEnabled: false
