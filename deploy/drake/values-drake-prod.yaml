# Drake production values — drake-prod namespace, first deployment.
#
# This file is committed on purpose: it contains no secret value, only the
# NAMES of Secrets created out of band, and the shape of the release. What
# it does contain is the deployment decision, which belongs under review.
#
# Images are pinned to real digests published from main@501c954
# (run 31246802303). Both were built from that one commit, so the API, the
# web app and the migration cannot drift apart.
#
# Nothing is left blank: the datastores are selected by label rather than
# by address, so this file is complete as committed.
#
# Everything else here is deliberate and should not be changed casually.

deploymentMode: production

# The first deployment publishes NO public route.
#
# Drake is proven to start, migrate, pass its probes and serve on its
# ClusterIP Services before a hostname, a certificate and an identity
# provider are attached to it. Those are a separate integration task, and
# coupling them to "does the application run at all" is how a failure in
# one gets diagnosed as the other.
edge:
  mode: internal

ingress:
  enabled: false

# REQUIRED even though nothing is published yet.
#
# Writing this hostname creates NO DNS record, NO certificate and NO
# Ingress. edge.mode stays `internal`; this is only the origin Drake will
# answer on once a route is added.
#
# This is the deployment's identity, not merely its address: the session
# cookie, the CSRF origin comparison and the OIDC redirect URL all derive
# from it, and the API refuses to start in production without a valid
# https origin. Declaring it now means flipping edge.mode to `ingress`
# later changes the route and nothing about identity.
#
# The operator supplies the real hostname. It is deliberately not guessed
# here — an invented hostname would render, deploy, and then mint cookies
# and callbacks for a name nobody owns.
publicOrigin: https://drake.duosis.com

# Drake's GHCR packages are private. Without this every pod stops at
# ImagePullBackOff. Created out of band:
#   kubectl -n drake-prod create secret docker-registry drake-ghcr ...
imagePullSecrets:
  - drake-ghcr

api:
  replicas: 2
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Source commit 501c954829a5a342e35d30db4267d71a7a0cfaaa
    # Published as the tag of the same name; pinned here by digest because
    # the chart accepts only one immutable reference in production, and a
    # tag — even a commit-SHA tag — can in principle be repointed.
    digest: "sha256:8cd200c141f469f7418aeed7dabc018e9c0dee267e871c4eeddd9317d1984ef5"
  # Created out of band; see docs/runbooks/STANDARD_KUBERNETES_DEPLOYMENT.md
  # for the exact key list. The chart creates no Secret.
  existingSecret: drake-api-config
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

web:
  replicas: 2
  image:
    repository: ghcr.io/duosis-developer-team/drake-web
    # Source commit 501c954829a5a342e35d30db4267d71a7a0cfaaa
    digest: "sha256:59b77162ac3bde81d25b4e77957886a4b99bb621f216a137361709fb69122675"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

migration:
  enabled: true
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Same digest as the API: the migration must run the exact code that
    # is about to serve.
    digest: "sha256:8cd200c141f469f7418aeed7dabc018e9c0dee267e871c4eeddd9317d1984ef5"
  backoffLimit: 0

networkPolicy:
  # The target cluster runs Flannel with no policy controller, so nothing
  # enforces these today. They are declarative intent and must not be
  # counted as a control until an enforcing CNI is present. They are still
  # written correctly, so that the day one appears, Drake keeps working.
  enabled: true
  # Selected by label, so a rescheduled datastore pod keeps its access and
  # no ClusterIP or pod address is ever hard-coded. These labels must match
  # the datastore pods deployed alongside Drake.
  database:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: drake-postgres
    port: 5432
  redis:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: drake-redis
    port: 6379
  # The cluster's resolver, verified read-only on the target cluster:
  # CoreDNS pods carry k8s-app=kube-dns in kube-system, and the namespace
  # carries the standard kubernetes.io/metadata.name label.
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    port: 53
  # Drake calls no third party in this deployment: telemetry connectors are
  # unset and the GitHub integration is disabled. Add narrow entries here
  # when either is switched on.
  apiExternalEgress: []

# Drake deploys before the GitHub App exists. The integration UI reports
# NOT_CONFIGURED, no token is minted, and no provider call is made.
github:
  enabled: false
