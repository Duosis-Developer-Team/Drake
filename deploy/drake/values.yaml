# Drake control plane values.
#
# Defaults here are DEVELOPMENT defaults. `deploymentMode: production`
# turns on the fail-closed checks in _helpers.tpl: every value the
# production edge contract needs must then be supplied explicitly, because
# a plausible default is exactly how an environment ends up unprotected
# without anyone deciding that it should be.
#
# No secret VALUE ever belongs in this file. Secrets are referenced by the
# name of a Kubernetes Secret created out of band.

deploymentMode: development

# The single public origin. `/` serves the web app and `/v1` the API.
# This is the ONE source of truth for the public hostname; in `ingress`
# edge mode `ingress.host` must agree with it.
publicOrigin: ""

namespaceOverride: ""

# How Drake is reached.
#
#   internal — no public route at all. Drake runs and is reachable inside
#              the cluster on its ClusterIP Services. This is the honest
#              state of a first deployment: the application is proven to
#              start, migrate and serve before a hostname, a certificate
#              and an identity provider are wired to it.
#   ingress  — a Kubernetes Ingress terminating TLS on the public origin
#              (ADR-0021).
#
# Exactly one mode is active, and each fails closed on its own inputs.
edge:
  mode: internal

ingress:
  enabled: false
  # No default class: the right one is cluster-specific, and guessing it
  # produces an Ingress that silently matches nothing.
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    # Name of a Secret holding the certificate. Never the certificate.
    secretName: ""

# Names of Secrets of type kubernetes.io/dockerconfigjson, created out of
# band. Drake's images are private, so without this every pod stops at
# ImagePullBackOff. The chart never creates or contains the Secret itself.
imagePullSecrets: []

api:
  replicas: 2
  port: 8000
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Digest-pinned in production. `tag` exists for disposable clusters.
    digest: ""
    tag: ""
  # Names of Secrets created out of band. Never values.
  existingSecret: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

web:
  replicas: 2
  port: 3000
  image:
    repository: ghcr.io/duosis-developer-team/drake-web
    digest: ""
    tag: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

migration:
  # One owner, one path: a pre-install/pre-upgrade Job running
  # `alembic upgrade head`. Never a downgrade, never a second mechanism.
  enabled: true
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    digest: ""
    tag: ""
  backoffLimit: 0
  # Alembic applies DDL and waits on the database; it is short-lived and
  # single-threaded, so it is sized well below the API rather than copied
  # from it. The memory limit is what matters — a large migration builds
  # its plan in memory — and the CPU request stays small so a release is
  # not delayed waiting for a scheduling slot.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

networkPolicy:
  enabled: true
  # Which namespace and pods the ingress controller runs as. Required in
  # `ingress` edge mode: without them a default-deny policy silently blocks
  # the route that was just configured.
  ingressControllerNamespaceSelector: {}
  ingressControllerPodSelector: {}

  # Drake's datastores are selected by LABEL, not by address.
  #
  # A pod connecting to a Service is redirected to a backing pod address
  # before egress policy is evaluated, and where that rewrite sits relative
  # to policy evaluation is up to the CNI. An `ipBlock` holding a ClusterIP
  # is therefore not portable, and a pod address is not stable across a
  # reschedule. `podSelector` is the construct Kubernetes defines for
  # in-cluster peers, and it survives both.
  database:
    # Empty selector = required. A `{}` selector would match every pod in
    # the namespace, so the chart refuses to render on one.
    podSelector:
      matchLabels: {}
    # Omit namespaceSelector to keep the peer in Drake's own namespace,
    # which is where the deployment puts it. Set it only to reach a
    # datastore that genuinely lives elsewhere; `{}` (all namespaces) is
    # refused.
    namespaceSelector: {}
    port: 5432
  redis:
    podSelector:
      matchLabels: {}
    namespaceSelector: {}
    port: 6379

  # Narrow, explicit outbound HTTPS for the API — a telemetry provider, or
  # GitHub when that integration is enabled. Empty by default because a
  # default Drake talks to neither. Each entry is one CIDR and one port;
  # 0.0.0.0/0 and ::/0 are refused.
  apiExternalEgress: []
  #  - cidr: 10.20.30.40/32
  #    port: 443

github:
  # Drake must be deployable before the real App exists. Disabled means
  # no token mint, no webhook registration, no provider call.
  enabled: false
  # Name of a Secret holding TWO keys, both mounted as files:
  #   private-key.pem  — the App's private key
  #   webhook-secret   — the webhook signing secret
  # Mounted, not envFrom'd: the API reads both from disk precisely so the
  # material never becomes an environment variable visible in `kubectl
  # describe pod`, a crash dump, or a child process environment.
  existingSecret: ""
  secretMountPath: /etc/drake/github
  # Public identifiers, not secrets. Required when enabled.
  appId: ""
  clientId: ""
