# Drake control plane values.
#
# Defaults here are DEVELOPMENT defaults. `deploymentMode: production`
# turns on the fail-closed checks in _helpers.tpl: every value the
# production edge contract needs must then be supplied explicitly, because
# a plausible default is exactly how an environment ends up unprotected
# without anyone deciding that it should be.
#
# No secret VALUE ever belongs in this file. Secrets are referenced by the
# name of a Kubernetes Secret created out of band.

deploymentMode: development

# The single public origin. `/` serves the web app and `/v1` the API.
# This is the ONE source of truth for the public hostname; in `ingress`
# edge mode `ingress.host` must agree with it.
publicOrigin: ""

namespaceOverride: ""

# Which way in Drake offers. `oidc` delegates to an identity provider;
# `local` verifies an email and password itself. Exactly one is active.
auth:
  mode: oidc

# How Drake is reached.
#
#   internal — no public route at all. Drake runs and is reachable inside
#              the cluster on its ClusterIP Services. This is the honest
#              state of a first deployment: the application is proven to
#              start, migrate and serve before a hostname, a certificate
#              and an identity provider are wired to it.
#   ingress  — a Kubernetes Ingress terminating TLS on the public origin
#              (ADR-0021).
#
# Exactly one mode is active, and each fails closed on its own inputs.
edge:
  mode: internal

  # Drake's own ingress-nginx, used in `ingress` mode.
  #
  # The cluster's shared controllers already serve other applications, and
  # one of them publishes a hostless catch-all Ingress — so Drake cannot
  # add rules there without competing for `/`. Its own controller watches
  # only its own IngressClass and its own namespace.
  dedicatedController:
    enabled: false
    ingressClassName: drake-nginx
    # Must be unique in the cluster: two controllers sharing a class would
    # each serve the other's Ingresses.
    controllerClass: k8s.io/drake-nginx
    replicas: 1
    # HTTPS only. No plaintext node port is published.
    httpsNodePort: 0
    image:
      repository: registry.k8s.io/ingress-nginx/controller
      digest: ""
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

ingress:
  enabled: false
  # No default class: the right one is cluster-specific, and guessing it
  # produces an Ingress that silently matches nothing.
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    # `secret`             — terminate with a certificate this cluster holds.
    # `controller-default` — terminate with the ingress controller's own
    #                        default certificate. That certificate is
    #                        self-signed, so browsers warn. Chosen only
    #                        where an accepted-risk edge already works that
    #                        way; it is never a substitute for a real one.
    mode: secret
    # Name of a Secret holding the certificate. Never the certificate.
    secretName: ""

# Names of Secrets of type kubernetes.io/dockerconfigjson, created out of
# band. Drake's images are private, so without this every pod stops at
# ImagePullBackOff. The chart never creates or contains the Secret itself.
imagePullSecrets: []

api:
  replicas: 2
  port: 8000
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Digest-pinned in production. `tag` exists for disposable clusters.
    digest: ""
    tag: ""
  # Names of Secrets created out of band. Never values.
  existingSecret: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

web:
  replicas: 2
  port: 3000
  image:
    repository: ghcr.io/duosis-developer-team/drake-web
    digest: ""
    tag: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

migration:
  # One owner, one path: a pre-install/pre-upgrade Job running
  # `alembic upgrade head`. Never a downgrade, never a second mechanism.
  enabled: true
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    digest: ""
    tag: ""
  backoffLimit: 0
  # Alembic applies DDL and waits on the database; it is short-lived and
  # single-threaded, so it is sized well below the API rather than copied
  # from it. The memory limit is what matters — a large migration builds
  # its plan in memory — and the CPU request stays small so a release is
  # not delayed waiting for a scheduling slot.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

networkPolicy:
  enabled: true
  # Which namespace and pods the ingress controller runs as. Required in
  # `ingress` edge mode: without them a default-deny policy silently blocks
  # the route that was just configured.
  ingressControllerNamespaceSelector: {}
  ingressControllerPodSelector: {}

  # Drake's datastores are selected by LABEL, not by address.
  #
  # A pod connecting to a Service is redirected to a backing pod address
  # before egress policy is evaluated, and where that rewrite sits relative
  # to policy evaluation is up to the CNI. An `ipBlock` holding a ClusterIP
  # is therefore not portable, and a pod address is not stable across a
  # reschedule. `podSelector` is the construct Kubernetes defines for
  # in-cluster peers, and it survives both.
  # Both datastores must live in Drake's own namespace. There is no
  # cross-namespace option, and setting one is refused rather than ignored:
  # a NetworkPolicy only governs pods in its own namespace, so allowing the
  # egress side to point elsewhere would produce a rule that looks complete
  # while the matching ingress policy could never be created. Reaching a
  # datastore in another namespace needs a design that manages the policy
  # on that side too; that is deliberately not in this chart.
  database:
    # Required. A `{}` selector would match every pod in the namespace, so
    # the chart refuses to render on one.
    podSelector:
      matchLabels: {}
    port: 5432
  redis:
    podSelector:
      matchLabels: {}
    port: 6379

  # DNS, narrowed to the resolver itself.
  #
  # `namespaceSelector: {}` on port 53 would permit every pod in every
  # namespace on that port, which is not "DNS only". Both selectors are
  # required and are combined in ONE peer, so they intersect: the named
  # pods in the named namespace, and nothing else.
  dns:
    namespaceSelector:
      matchLabels: {}
    podSelector:
      matchLabels: {}
    port: 53

  # Narrow, explicit outbound HTTPS for the API — a telemetry provider, or
  # GitHub when that integration is enabled. Empty by default because a
  # default Drake talks to neither. Each entry is one CIDR and one port;
  # 0.0.0.0/0 and ::/0 are refused.
  apiExternalEgress: []
  #  - cidr: 10.20.30.40/32
  #    port: 443

  # In-cluster destinations for the API, named the way the agent's egress
  # names its gateway: by namespace and pod labels. A Service's ClusterIP
  # is not an identity — recreating the Service assigns a new one and the
  # rule goes on matching nothing — so a metrics backend living in this
  # cluster belongs here rather than in `apiExternalEgress`.
  # Who may reach the API in-cluster, beyond the edge. Alertmanager
  # delivers notifications to `/v1/webhooks/alertmanager/{key}` and is the
  # first entry this list has ever needed.
  apiClusterIngress: []
  #  - namespace: drake-monitoring
  #    podSelector:
  #      app.kubernetes.io/name: alertmanager

  apiClusterEgress: []
  #  - namespace: drake-monitoring
  #    podSelector:
  #      app.kubernetes.io/name: prometheus
  #    port: 9090

alerting:
  # Alertmanagers Drake accepts alerts from. The map key is the OPAQUE
  # WEBHOOK KEY in `/v1/webhooks/alertmanager/{key}`, and it decides which
  # project those alerts may resolve into — a payload cannot name its own
  # project, which is the whole reason this registry exists.
  #
  # `existingSecret` holds one key per integration, each containing that
  # integration's bearer token. Mounted as files, never as env values, and
  # the same Secret is mounted into Alertmanager so both ends compare the
  # same material.
  #
  # `apiBaseUrl` is left unset: it is where Drake would CREATE silences, it
  # must be https outside local/test, and an in-cluster Alertmanager speaks
  # http. Reading alerts needs none of it, so the credential does not exist
  # until silencing does.
  existingSecret: ""
  secretMountPath: /etc/drake/alertmanager
  integrations: {}
  #  hermes:
  #    projectKey: hermes
  #    displayName: "Duosis production Alertmanager"

telemetry:
  # Server-owned Prometheus connectors, by the name an integration's
  # `config_ref` points at. Empty by default: a Drake with no metrics
  # backend reports every signal as unavailable, which is the honest answer
  # and not a failure.
  #
  # `url` must be an IP LITERAL in production — hostname connectors are
  # refused until the transport pins the address it validated, because
  # httpx re-resolves and a hostile answer could flip public→private in
  # between. For an in-cluster provider, pin the Service's clusterIP in the
  # provider's own chart and put that address here; it is then a declared
  # constant rather than whatever the cluster assigned this time.
  #
  # `allowPrivate` and `allowPlaintext` are separate, deliberate opt-ins.
  # Plaintext is refused to a public address even when set.
  connectors: {}
  #  duosis-prod-1:
  #    url: http://10.233.0.42
  #    allowPrivate: true
  #    allowPlaintext: true

deployments:
  # Deployment history: which revision of a workload has been running since
  # when, and whether health changed across the rollout.
  #
  # This reads the inventory the cluster agent ALREADY reports. It makes no
  # Kubernetes call of its own and needs no GitHub permission — the agent
  # stays the only thing that talks to a cluster, and this only interprets
  # what it sent. So enabling it adds no access, only interpretation.
  #
  # Off by default because a Drake with no agent enrolled has nothing to
  # interpret, and a worker polling an empty table every two minutes is
  # noise. Turn it on for any deployment where an agent is connected.
  #
  # The work is leased across replicas, so two API pods cannot both ingest
  # the same cycle.
  ingestEnabled: false
  ingestIntervalSeconds: 120

github:
  # Drake must be deployable before the real App exists. Disabled means
  # no token mint, no webhook registration, no provider call.
  enabled: false
  # Name of a Secret holding TWO keys, both mounted as files:
  #   private-key.pem  — the App's private key
  #   webhook-secret   — the webhook signing secret
  # Mounted, not envFrom'd: the API reads both from disk precisely so the
  # material never becomes an environment variable visible in `kubectl
  # describe pod`, a crash dump, or a child process environment.
  existingSecret: ""
  secretMountPath: /etc/drake/github
  # Public identifiers, not secrets. Required when enabled.
  appId: ""
  clientId: ""
  # --- repository writes ------------------------------------------------
  #
  # The ONLY path through which Drake would write to a repository: a branch
  # and a DRAFT pull request carrying a generated manifest. Never a merge,
  # never a force-push, never a commit to a default branch.
  #
  # Both flags are one decision and the chart refuses half of it. On its
  # own, `gitopsPrEnabled` accepts requests nothing delivers, and
  # `workerEnabled` runs a loop nothing can reach — two states that look
  # like they are working.
  #
  # They also require `github.enabled`, because a write path needs a real
  # App behind it. Turning these on is an explicit decision, not a default,
  # and it needs the App's permissions to include Contents: write and Pull
  # requests: write.
  gitopsPrEnabled: false
  workerEnabled: false

# The internal agent API: the only surface a cluster agent talks to.
#
# A separate workload from the public API, because it holds the Agent CA
# private key and speaks mutual TLS to machines — neither belongs in the
# process that answers browsers. Off by default: shipping the listener and
# turning it on are separate decisions.
#
# It is never published. There is no ingress, node port or load balancer
# option here, and the Service type is not configurable.
internalAgentApi:
  enabled: false
  # Server-authenticated TLS, no client certificate asked for. Only the
  # enrolment endpoint is served here.
  enrollPort: 8144
  # CERT_REQUIRED mutual TLS. Everything an enrolled agent does.
  ingestPort: 8143
  # Created out of band. The chart creates no Secret.
  #   tlsSecret: kubernetes.io/tls — the listener's own server certificate
  #   caSecret:  ca.crt + ca.key   — the CA that signs agent identities
  tlsSecret: ""
  caSecret: ""
  # Where the agent runs. Used ONLY to narrow the NetworkPolicy: it selects
  # a namespace and a pod label, which is a network boundary, not an
  # identity. Authentication is mutual TLS plus proof-of-possession.
  agentNamespace: drake-agent
  agentPodSelector:
    app.kubernetes.io/name: drake-cluster-agent
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
