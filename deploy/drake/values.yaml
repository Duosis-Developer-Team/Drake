# Drake control plane values.
#
# Defaults here are DEVELOPMENT defaults. `deploymentMode: production`
# turns on the fail-closed checks in _helpers.tpl: every value the
# production edge contract needs must then be supplied explicitly, because
# a plausible default is exactly how an environment ends up unprotected
# without anyone deciding that it should be.
#
# No secret VALUE ever belongs in this file. Secrets are referenced by the
# name of a Kubernetes Secret created out of band.

deploymentMode: development

# The single public origin. `/` serves the web app and `/v1` the API.
# This is the ONE source of truth for the public hostname; in `ingress`
# edge mode `ingress.host` must agree with it.
publicOrigin: ""

namespaceOverride: ""

# How Drake reaches the public internet.
#
#   ingress     — a Kubernetes Ingress on a shared controller, terminating
#                 TLS with a certificate this cluster holds (ADR-0021).
#   cloudflared — an outbound-only Cloudflare Tunnel. No Ingress, no
#                 inbound port, no certificate in the cluster: TLS is
#                 terminated at Cloudflare's edge and the connector dials
#                 out. Chosen when opening an inbound port would mean
#                 touching NAT rules or an ingress controller that other
#                 applications already depend on.
#
# Exactly one mode is active. Both are fail-closed: see drake.validateEdge.
edge:
  mode: ingress

ingress:
  enabled: false
  # No default class: the right one is cluster-specific, and guessing it
  # produces an Ingress that silently matches nothing.
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    # Name of a Secret holding the certificate. Never the certificate.
    secretName: ""

# Names of Secrets of type kubernetes.io/dockerconfigjson, created out of
# band. Drake's images are private, so without this every pod stops at
# ImagePullBackOff. The chart never creates or contains the Secret itself.
imagePullSecrets: []

api:
  replicas: 2
  port: 8000
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    # Digest-pinned in production. `tag` exists for disposable clusters.
    digest: ""
    tag: ""
  # Names of Secrets created out of band. Never values.
  existingSecret: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

web:
  replicas: 2
  port: 3000
  image:
    repository: ghcr.io/duosis-developer-team/drake-web
    digest: ""
    tag: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

migration:
  # One owner, one path: a pre-install/pre-upgrade Job running
  # `alembic upgrade head`. Never a downgrade, never a second mechanism.
  enabled: true
  image:
    repository: ghcr.io/duosis-developer-team/drake-api
    digest: ""
    tag: ""
  backoffLimit: 0

networkPolicy:
  enabled: true
  # Which namespace and pods the ingress controller runs as. Required in
  # production: without them a default-deny policy silently blocks the
  # route that was just configured.
  ingressControllerNamespaceSelector: {}
  ingressControllerPodSelector: {}
  # Egress targets the API genuinely needs, as explicit CIDRs.
  databaseCIDR: ""
  redisCIDR: ""

github:
  # Drake must be deployable before the real App exists. Disabled means
  # no token mint, no webhook registration, no provider call.
  enabled: false
  # Name of a Secret holding TWO keys, both mounted as files:
  #   private-key.pem  — the App's private key
  #   webhook-secret   — the webhook signing secret
  # Mounted, not envFrom'd: the API reads both from disk precisely so the
  # material never becomes an environment variable visible in `kubectl
  # describe pod`, a crash dump, or a child process environment.
  existingSecret: ""
  secretMountPath: /etc/drake/github
  # Public identifiers, not secrets. Required when enabled.
  appId: ""
  clientId: ""

# Cloudflare Tunnel connector. Only rendered when edge.mode is
# "cloudflared".
cloudflared:
  # Pinned by version AND digest. The tag is documentation; the digest is
  # what actually runs.
  image:
    repository: docker.io/cloudflare/cloudflared
    version: "2026.5.0"
    digest: "sha256:59bab8d3aceec09bf6bdb07d6beca0225ca5cd7ab79436a87ea97978fe1dc4f9"
  # Two connectors so one node failing does not take Drake offline.
  # Deliberately no HPA: connector count is a topology decision, not a
  # load-driven one.
  replicas: 2
  # Name of a Secret created out of band in this namespace, holding
  # exactly two keys: `tunnel-id` and `credentials.json`.
  # The Secret is NEVER created by this chart and never enters Git.
  tunnelSecretName: ""
  # Port the connector serves its own /ready and /metrics on. Pod-local:
  # no Service, no NodePort, no Ingress is created for it.
  metricsPort: 2000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
