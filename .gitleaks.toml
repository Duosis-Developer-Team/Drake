# Gitleaks configuration.
#
# The default ruleset is fully enabled and there are NO path allowlists:
# no source, test, fixture, docs, or contracts directory is excluded from
# scanning. Credential-shaped test values are generated at test runtime from
# concatenated parts and are never committed as scannable literals, so the
# scanner needs no exemptions. A canary regression test
# (scripts/secret-scan.sh canary) plants a temporary high-confidence fake
# credential inside the negative-fixture directory and asserts the scanner
# detects it — proving that directory is NOT exempt.
#
# Do not add path allowlists or value-shape allowlists to silence a
# finding; fix the finding. Only two exemption mechanisms are sanctioned,
# both of which exempt one occurrence and nothing else:
#
#   1. An inline `gitleaks:allow` marker on the flagged line itself, with a
#      comment saying why that literal is not a credential. Preferred: it
#      lives next to the value, survives edits that move the line, and
#      cannot widen to a second occurrence. It is LINE-scoped, not
#      value-scoped — the line it sits on is no longer scanned at all, so
#      only put it on a line whose content is a fixed, public identifier.
#   2. An exact single-finding fingerprint in .gitleaksignore, for findings
#      in files or historical commits where no inline marker can be placed.
#
# Shape rules were removed after review because a credential COULD be
# committed inside an innocuous-looking field shape.

[extend]
useDefault = true
