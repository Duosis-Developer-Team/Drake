# Gitleaks configuration.
#
# The default ruleset is fully enabled and there are NO path allowlists:
# no source, test, fixture, docs, or contracts directory is excluded from
# scanning. Credential-shaped test values are generated at test runtime from
# concatenated parts and are never committed as scannable literals, so the
# scanner needs no exemptions. A canary regression test
# (scripts/secret-scan.sh canary) plants a temporary high-confidence fake
# credential inside the negative-fixture directory and asserts the scanner
# detects it — proving that directory is NOT exempt.
#
# Do not add path allowlists or value-shape allowlists to silence a
# finding; fix the finding. The ONLY sanctioned exemption mechanism is an
# exact single-finding fingerprint in .gitleaksignore with a written
# justification — shape rules were removed after review because a
# credential COULD be committed inside an innocuous-looking field shape.

[extend]
useDefault = true
