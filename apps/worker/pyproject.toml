[project]
name = "drake-worker"
version = "0.1.0"
description = "Drake background job runner (Redis-backed, idempotent jobs)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drake_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the local Compose stack (disposable Redis)",
]
